name: Character Select Parser Fix Promotion

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths: [ '.github/workflows/charselect-preflight.yml' ]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote validated v0.8.4 Animate parser fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout charselect-full-checkpoint
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/ae2a9fe5ada73886efde45e42ca3ad87876b54ec" --jq .content \
            | tr -d '\n' | base64 -d > ci/charselect/build_v084_charselect_full.py.gz
          gzip -dc ci/charselect/build_v084_charselect_full.py.gz > /tmp/build_v084_charselect_full.py
          echo 'aefbdec3e9bb0d020a2e525d0fec6fdb5182445515245a622b92d37b8ed0f051  /tmp/build_v084_charselect_full.py' | sha256sum -c -
          sed -i -E "s#echo '[0-9a-f]{64}  scripts/build_v084_charselect_full.py'#echo 'aefbdec3e9bb0d020a2e525d0fec6fdb5182445515245a622b92d37b8ed0f051  scripts/build_v084_charselect_full.py'#" .github/workflows/charselect-full-build.yml
          grep -F "aefbdec3e9bb0d020a2e525d0fec6fdb5182445515245a622b92d37b8ed0f051  scripts/build_v084_charselect_full.py" .github/workflows/charselect-full-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/charselect/build_v084_charselect_full.py.gz .github/workflows/charselect-full-build.yml
          git diff --cached --check
          git commit -m 'Fix v0.8.4 Animate atlas parsing'
          git push origin HEAD:charselect-full-checkpoint
