name: Character Select Asset Preflight

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths: [ '.github/workflows/charselect-preflight.yml' ]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
      - name: Download official v0.8.4 Character Select source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets \
            --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip' \
            --pattern 'Sounds.and.Songs.zip'
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
          unzip -qo official-assets/Sounds.and.Songs.zip -d official-v084
      - name: Probe Character Select Animate parser
        run: |
          gzip -dc ci/charselect/build_v084_charselect_full.py.gz > scripts/build_v084_charselect_full.py
          python3 - <<'PY'
          import json, sys, traceback
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import build_v084_charselect_full as b
          root=Path('official-v084/images/charSelect')
          names=['crowd','charSelectStage','barThing','bfChill','gfChill','lockedChill','charSelectSpeakers']
          lines=[]
          for name in names:
              folder=root/name
              try:
                  a=b.load_animate(folder)
                  lines.append(f'{name}:OK root={a.root_symbol!r} symbols={len(a.symbols)} sprites={len(a.sprites)} labels={b._labels(a.symbols[a.root_symbol])[:12]!r}')
              except Exception as e:
                  lines.append(f'{name}:FAIL {type(e).__name__}: {e}')
                  lines.append(traceback.format_exc(limit=8))
          for name in ['bfChill','crowd']:
              p=root/name/'Animation.json'
              d=json.loads(p.read_text())
              lines.append(f'{name}.AN.type={type(d.get("AN")).__name__} value={repr(d.get("AN"))[:1200]}')
              lines.append(f'{name}.SD.type={type(d.get("SD")).__name__} keys={list(d.get("SD",{}).keys()) if isinstance(d.get("SD"),dict) else "NA"}')
              sm=json.loads((root/name/'spritemap1.json').read_text())
              lines.append(f'{name}.ATLAS.keys={list(sm.keys())} atlas_type={type(sm.get("ATLAS")).__name__} atlas_preview={repr(sm.get("ATLAS"))[:1800]}')
          def esc(s):
              return s.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          msg='\n'.join(lines)
          print('::error title=Character Select parser probe::'+esc(msg[:12000]))
          raise SystemExit(1)
          PY
