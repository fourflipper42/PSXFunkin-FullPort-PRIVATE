name: Character Select Asset Preflight

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths: [ '.github/workflows/charselect-preflight.yml' ]

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
      - name: Download official v0.8.4 Character Select source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets \
            --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip' \
            --pattern 'Sounds.and.Songs.zip'
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
          unzip -qo official-assets/Sounds.and.Songs.zip -d official-v084
      - name: Probe Character Select Animate parser
        run: |
          gzip -dc ci/charselect/build_v084_charselect_full.py.gz > scripts/build_v084_charselect_full.py
          set +e
          python3 - <<'PY' > parser-probe.txt 2>&1
          import json, sys, traceback
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          print('IMPORT_START')
          import build_v084_charselect_full as b
          print('IMPORT_OK')
          root=Path('official-v084/images/charSelect')
          names=['crowd','charSelectStage','barThing','bfChill','gfChill','lockedChill','charSelectSpeakers']
          for name in names:
              folder=root/name
              try:
                  a=b.load_animate(folder)
                  print(f'{name}:OK root={a.root_symbol!r} symbols={len(a.symbols)} sprites={len(a.sprites)} labels={b._labels(a.symbols[a.root_symbol])[:12]!r}')
              except Exception as e:
                  print(f'{name}:FAIL {type(e).__name__}: {e}')
                  traceback.print_exc(limit=10)
          for name in ['bfChill','crowd']:
              p=root/name/'Animation.json'
              d=json.loads(p.read_text())
              print(f'{name}.AN.type={type(d.get("AN")).__name__} value={repr(d.get("AN"))[:1200]}')
              print(f'{name}.SD.type={type(d.get("SD")).__name__} keys={list(d.get("SD",{}).keys()) if isinstance(d.get("SD"),dict) else "NA"}')
              sm=json.loads((root/name/'spritemap1.json').read_text())
              print(f'{name}.ATLAS.keys={list(sm.keys())} atlas_type={type(sm.get("ATLAS")).__name__} atlas_preview={repr(sm.get("ATLAS"))[:1800]}')
          PY
          RC=$?
          set -e
          cat parser-probe.txt
          echo "PROBE_RC=$RC" >> parser-probe.txt
      - name: Commit parser probe text for inspection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT="$(base64 -w0 parser-probe.txt)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ci/charselect/parser-probe.txt" \
            -f message='Record Character Select parser probe' \
            -f content="$CONTENT" \
            -f branch='charselect-full-checkpoint'
