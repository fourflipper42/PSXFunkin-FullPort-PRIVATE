name: Character Select Checksum Promotion

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths: [ '.github/workflows/charselect-preflight.yml' ]

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote fixed Character Select builder checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gzip -dc ci/charselect/build_v084_charselect_full.py.gz > /tmp/build_v084_charselect_full.py
          echo 'aefbdec3e9bb0d020a2e525d0fec6fdb5182445515245a622b92d37b8ed0f051  /tmp/build_v084_charselect_full.py' | sha256sum -c -
          python3 -m py_compile /tmp/build_v084_charselect_full.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/charselect-full-build.yml')
          s=p.read_text()
          old="25d291433d3f29b4962139f334113d155d3dd3374084881da4dff10a142dcc1c  scripts/build_v084_charselect_full.py"
          new="aefbdec3e9bb0d020a2e525d0fec6fdb5182445515245a622b92d37b8ed0f051  scripts/build_v084_charselect_full.py"
          if old not in s:
              if new in s:
                  print('checksum already promoted')
              else:
                  raise SystemExit('Character Select builder checksum line not found')
          else:
              p.write_text(s.replace(old,new,1))
          PY
          grep -F "aefbdec3e9bb0d020a2e525d0fec6fdb5182445515245a622b92d37b8ed0f051  scripts/build_v084_charselect_full.py" .github/workflows/charselect-full-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/charselect-full-build.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Use fixed Character Select Animate parser'
            git push origin HEAD:charselect-full-checkpoint
          fi
          gh workflow run charselect-full-build.yml --ref charselect-full-checkpoint
