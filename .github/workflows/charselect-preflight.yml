name: Character Select Intro Extraction Promotion

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths: [ '.github/workflows/charselect-preflight.yml' ]

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable robust authentic introSelect extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/charselect-full-build.yml')
          s=p.read_text()
          marker="          python3 -m py_compile scripts/build_v084_charselect_full.py scripts/apply_v084_charselect_full.py\n"
          addition=(
              marker
              + "          python3 scripts/fix_charselect_intro_extraction.py scripts/build_v084_charselect_full.py\n"
              + "          python3 -m py_compile scripts/build_v084_charselect_full.py\n"
          )
          if 'fix_charselect_intro_extraction.py scripts/build_v084_charselect_full.py' in s:
              print('intro extraction patch step already enabled')
          elif marker in s:
              p.write_text(s.replace(marker, addition, 1))
          else:
              raise SystemExit('full Character Select workflow expansion anchor not found')
          PY
          grep -F 'python3 scripts/fix_charselect_intro_extraction.py scripts/build_v084_charselect_full.py' .github/workflows/charselect-full-build.yml
          python3 -m py_compile scripts/fix_charselect_intro_extraction.py
          echo '064be5ab2c2403c3f7cb6adc651d789c6b26deee0193837200122553030952b7  scripts/fix_charselect_intro_extraction.py' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/charselect-full-build.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Harden authentic introSelect frame extraction'
            git push origin HEAD:charselect-full-checkpoint
          fi
          gh workflow run charselect-full-build.yml --ref charselect-full-checkpoint
