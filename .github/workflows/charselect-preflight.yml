name: Character Select Asset Preflight

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths: [ '.github/workflows/charselect-preflight.yml' ]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official v0.8.4 Character Select source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets \
            --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip' \
            --pattern 'Sounds.and.Songs.zip'
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
          unzip -qo official-assets/Sounds.and.Songs.zip -d official-v084
      - name: Emit exact Character Select inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('official-v084/images/charSelect')
          dirs=sorted(p.name for p in root.iterdir() if p.is_dir())
          expected=['crowd','charSelectStage','barThing','bfChill','gfChill','lockedChill','charSelectSpeakers']
          details=[]
          for name in dirs:
              p=root/name
              if (p/'Animation.json').is_file():
                  maps=sorted(x.name for x in p.glob('spritemap*.json'))
                  details.append(f'{name}:ANIMATE:{",".join(maps)}')
          static=sorted(p.name for p in root.iterdir() if p.is_file())
          audio=[]
          for p in Path('official-v084').rglob('*'):
              if p.is_file() and any(k.lower() in p.stem.lower() for k in ['stayfunky','cs_select','cs_locked','cs_lights','cs_confirm']):
                  audio.append(str(p))
          def esc(s):
              return s.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          msg='DIRS='+'|'.join(dirs)+'\nANIMATE='+'|'.join(details)+'\nSTATIC='+'|'.join(static)+'\nAUDIO='+'|'.join(audio)+'\nEXPECTED='+'|'.join(f'{x}:{(root/x/"Animation.json").is_file()}' for x in expected)
          print('::error title=Character Select source inventory::'+esc(msg))
          raise SystemExit(1)
          PY
