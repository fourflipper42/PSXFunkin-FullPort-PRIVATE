name: Diagnose released MENU.ARC

on:
  push:
    branches: [full-port-completion]
    paths:
      - '.github/workflows/diag-release-menu-arc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install ISO inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bchunk genisoimage

      - name: Download exact released BIN and CUE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download pico-mixes-v1-b06219f64ccf \
            --repo fourflipper42/PSXFunkin-FullPort \
            --pattern 'PSXFunkin_v084_Pico_Mixes_v1.bin' \
            --pattern 'PSXFunkin_v084_Pico_Mixes_v1.cue'
          ls -lh PSXFunkin_v084_Pico_Mixes_v1.*

      - name: Convert raw MODE2 track to ISO payload
        run: |
          set -euxo pipefail
          bchunk \
            PSXFunkin_v084_Pico_Mixes_v1.bin \
            PSXFunkin_v084_Pico_Mixes_v1.cue \
            released
          ls -lh released*.iso

      - name: Inspect ISO filesystem and MENU directory
        run: |
          set -euxo pipefail
          ISO=$(ls released*.iso | head -n1)
          isoinfo -i "$ISO" -f | tee iso-files.txt
          echo '--- MENU entries ---'
          grep -i '^/MENU/' iso-files.txt || true
          echo '--- exact boot archive check ---'
          if grep -Fxqi '/MENU/MENU.ARC;1' iso-files.txt; then
            echo 'MENU_ARC_PRESENT=1'
          else
            echo 'MENU_ARC_PRESENT=0'
            exit 23
          fi

      - name: Extract MENU.ARC for integrity check
        run: |
          set -euxo pipefail
          ISO=$(ls released*.iso | head -n1)
          isoinfo -i "$ISO" -x '/MENU/MENU.ARC;1' > MENU.ARC
          test -s MENU.ARC
          ls -lh MENU.ARC
          sha256sum MENU.ARC
