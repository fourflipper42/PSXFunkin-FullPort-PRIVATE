name: Apply final v7 Gfx_Tex scope fix

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths:
      - '.github/workflows/fix-v7-gfx-scope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: charselect-full-checkpoint

      - name: Move v7 Gfx_Tex arrays after gfx.h
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runner = Path('scripts/run_charselect_source_v7.py')
          s = runner.read_text()
          old = '''static Gfx_Tex menu_cs_grid_v7[3];\nstatic Gfx_Tex menu_cs_ctrl_v7[2];\n\n'''
          if s.count(old) != 1:
              raise SystemExit(f'generated-header Gfx_Tex block count={s.count(old)}')
          s = s.replace(old, '', 1)
          runner.write_text(s)

          apply = Path('scripts/apply_charselect_source_v7.py')
          s = apply.read_text()
          anchor = '''#define MENU_CS_V7_BG_CLUT_X 704\n#define MENU_CS_V7_BG_CLUT_Y 509\n\n'''
          insert = anchor + '''/* Gfx_Tex must be declared in menu.c after gfx.h, never in the early generated header. */\nstatic Gfx_Tex menu_cs_grid_v7[3];\nstatic Gfx_Tex menu_cs_ctrl_v7[2];\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'v7 runtime declaration anchor count={s.count(anchor)}')
          s = s.replace(anchor, insert, 1)
          apply.write_text(s)

          # Guard against reintroducing the exact compile-order regression.
          assert 'static Gfx_Tex menu_cs_grid_v7[3];' not in runner.read_text()
          assert 'static Gfx_Tex menu_cs_ctrl_v7[2];' not in runner.read_text()
          assert apply.read_text().count('static Gfx_Tex menu_cs_grid_v7[3];') == 2
          assert apply.read_text().count('static Gfx_Tex menu_cs_ctrl_v7[2];') == 2
          PY
          python3 -m py_compile scripts/run_charselect_source_v7.py scripts/apply_charselect_source_v7.py
          git diff --check
          git diff -- scripts/run_charselect_source_v7.py scripts/apply_charselect_source_v7.py

      - name: Commit scope fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run_charselect_source_v7.py scripts/apply_charselect_source_v7.py
          git commit -m 'Fix v7 Gfx_Tex declaration order'
          git push origin HEAD:charselect-full-checkpoint
