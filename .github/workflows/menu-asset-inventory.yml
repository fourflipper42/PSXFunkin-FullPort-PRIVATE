name: Inventory v0.8.4 Menu Assets

on:
  push:
    branches: [ menu-visual-parity-checkpoint ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official v0.8.4 shared asset archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets \
            --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip'
          echo 'd02d2ea24f9d5b032012a69ab533f724ee5cd364093e693f21d17bd3abfccc37  official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip' | sha256sum -c -
          unzip -q official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
      - name: Inventory Freeplay and Character Select sources
        run: |
          echo '===== FREEPLAY PATHS ====='
          find official-v084 -type f | grep -Ei '/(freeplay|freeplaymenu)/' | sort | head -n 1000
          echo '===== CHAR SELECT PATHS ====='
          find official-v084 -type f | grep -Ei '/(charselect|char.?select)/' | sort | head -n 1000
          echo '===== MENU-RELATED ROOT PATHS ====='
          find official-v084/images -maxdepth 3 -type f 2>/dev/null | grep -Ei '(freeplay|capsule|difficulty|character|charselect|backcard|dj|album|ost)' | sort | head -n 1000
