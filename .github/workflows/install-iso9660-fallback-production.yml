name: Install ISO9660 fallback into production

on:
  push:
    branches: [full-port-completion]
    paths:
      - '.github/workflows/install-iso9660-fallback-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-port-completion
          fetch-depth: 0

      - name: Patch production workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/charselect-v7-1-build.yml')
          text = path.read_text()

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              text = text.replace(old, new, 1)

          once(
              "      - 'scripts/apply_pico_mixes_v1.py'\n  workflow_dispatch:\n",
              "      - 'scripts/apply_pico_mixes_v1.py'\n"
              "      - 'scripts/apply_iso9660_lookup_fallback.py'\n"
              "      - 'scripts/validate_raw_psx_iso9660.py'\n"
              "  workflow_dispatch:\n",
              'watch paths',
          )

          once(
              "            scripts/build_pico_mix_movies.py \\\n"
              "            scripts/apply_pico_mixes_v1.py\n\n"
              "      - name: Install build dependencies\n",
              "            scripts/build_pico_mix_movies.py \\\n"
              "            scripts/apply_pico_mixes_v1.py \\\n"
              "            scripts/apply_iso9660_lookup_fallback.py \\\n"
              "            scripts/validate_raw_psx_iso9660.py\n\n"
              "      - name: Install build dependencies\n",
              'py compile list',
          )

          once(
              "      - name: Acquire PsyQ compatibility libraries\n",
              "      - name: Apply full-directory ISO9660 lookup fallback\n"
              "        run: |\n"
              "          python3 scripts/apply_iso9660_lookup_fallback.py --upstream upstream\n"
              "          grep -q 'IO_ISOSearchFile' upstream/src/io.c\n"
              "          grep -q 'CdSearchFile(file, (char\*)path)' upstream/src/io.c\n"
              "          git -C upstream diff --check\n\n"
              "      - name: Acquire PsyQ compatibility libraries\n",
              'runtime fallback step',
          )

          once(
              "          test \"$sectors\" -le 360000\n\n"
              "      - name: Package Pico Mixes v1 checkpoint\n",
              "          test \"$sectors\" -le 360000\n\n"
              "      - name: Validate raw disc filesystem\n"
              "        run: |\n"
              "          python3 scripts/validate_raw_psx_iso9660.py upstream/funkin.bin \\\n"
              "            --require '/MENU/MENU.ARC;1' \\\n"
              "            --require '/MENU/LOADING.TIM;1' \\\n"
              "            --require '/MENU/FPPICO.TIM;1' \\\n"
              "            --require '/CHAR/TANKBLDY.ARC;1' \\\n"
              "            --require '/WEEK10/10.15H.CHT;1' \\\n"
              "            --require-multisector-dir '/MENU' \\\n"
              "            --require-multisector-dir '/CHAR' \\\n"
              "            --require-multisector-dir '/WEEK10'\n\n"
              "      - name: Package Pico Mixes v1 checkpoint\n",
              'raw disc validation',
          )

          once(
              '          TAG="pico-mixes-v1-${SHORT}"\n',
              '          TAG="full-port-boot-io-v1-${SHORT}"\n',
              'release tag',
          )
          once(
              "            --title 'PSXFunkin official Pico Mixes v1 test' \\\n",
              "            --title 'PSXFunkin full port boot IO v1 test' \\\n",
              'release title',
          )
          once(
              "            --notes 'DuckStation checkpoint for all 15 official Pico Mixes, authentic Pico/Nene Character Select and Freeplay variants, per-song events and character variants, and the complete Stress Pico cutscenes. LE SSERAFIM, Weekend 1, and every earlier v7.1, Freeplay, pause, base-week, and console-save checkpoint remain integrated. This is not the final release.' \\\n",
              "            --notes 'Full-port boot IO repair checkpoint. Keeps the complete Pico Mixes, LE SSERAFIM, Weekend 1, Character Select v7.1, Freeplay, pause, base-week, and console-save integrations, and adds a full-directory ISO9660 fallback when PsyQ CdSearchFile misses records in multi-sector directories. The raw MODE2/2352 BIN is validated for late MENU, CHAR, and WEEK10 entries before publication. Runtime playthrough validation is still required.' \\\n",
              'release notes',
          )

          path.write_text(text)
          PY
          git diff --check
          git diff -- .github/workflows/charselect-v7-1-build.yml

      - name: Commit production integration
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/workflows/charselect-v7-1-build.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Apply full-directory ISO9660 boot lookup fallback'
          git push origin HEAD:full-port-completion
