name: Inspect official v0.8.4 Freeplay DJ metadata

on:
  push:
    branches: [ menu-visual-parity-checkpoint ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official shared assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip'
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
      - name: Inspect DJ atlas metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('official-v084/images/freeplay/freeplay-boyfriend')
          for name in ['Animation.json','spritemap1.json']:
              p=root/name
              print('===== '+name+' =====')
              data=json.loads(p.read_text())
              print(json.dumps(data, indent=2)[:50000])
          PY
