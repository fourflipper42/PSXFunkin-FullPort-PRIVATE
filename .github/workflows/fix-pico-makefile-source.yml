name: Fix Pico generator integration

on:
  push:
    branches: [ full-port-completion ]
    paths:
      - '.github/workflows/fix-pico-makefile-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-port-completion
      - name: Repair Pico stage definition separator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import py_compile

          path = Path('scripts/apply_pico_mixes_v1.py')
          text = path.read_text()
          old = '    path.write_text(text.rstrip() + ",\\n" + ",\\n".join(definitions) + "\\n")'
          new = (
              '    base = text.rstrip()\n'
              '    separator = "\\n" if base.endswith(",") else ",\\n"\n'
              '    path.write_text(base + separator + ",\\n".join(definitions) + "\\n")'
          )
          count = text.count(old)
          if count == 1:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif 'separator = "\\n" if base.endswith(",") else ",\\n"' not in text:
              raise SystemExit(f'expected Pico stagedef append anchor once, found {count}')

          py_compile.compile(str(path), doraise=True)
          repaired = path.read_text()
          if 'separator = "\\n" if base.endswith(",") else ",\\n"' not in repaired:
              raise SystemExit('Pico stagedef separator repair missing')
          print('Pico stagedef appender now preserves an existing trailing comma.')
          PY
          git diff --check
          git diff -- scripts/apply_pico_mixes_v1.py
      - name: Commit repair
        run: |
          if git diff --quiet -- scripts/apply_pico_mixes_v1.py; then
            echo 'Generator already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_pico_mixes_v1.py
          git commit -m 'Fix Pico stagedef separator'
          git push origin HEAD:full-port-completion
