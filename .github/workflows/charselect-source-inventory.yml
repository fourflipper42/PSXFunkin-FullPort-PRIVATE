name: Inventory v0.8.4 Character Select Sources

on:
  push:
    branches: [ menu-visual-parity-checkpoint ]
    paths: [ '.github/workflows/charselect-source-inventory.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official v0.8.4 source asset archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip' --pattern 'Sounds.and.Songs.zip'
          echo 'd02d2ea24f9d5b032012a69ab533f724ee5cd364093e693f21d17bd3abfccc37  official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip' | sha256sum -c -
          echo '042d0ecd29a5356b4c17e750118a52485ee69466e8f1da02fed057c4abd98dc7  official-assets/Sounds.and.Songs.zip' | sha256sum -c -
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
          unzip -qo official-assets/Sounds.and.Songs.zip -d official-v084
      - name: Inventory Character Select files and animation metadata
        run: |
          echo '=== CHARSELECT FILES ==='
          find official-v084 -type f | grep -Ei '/charselect/|charselect' | sort
          echo '=== INTROSELECT FILES ==='
          find official-v084 -type f | grep -Ei 'introselect' | sort || true
          echo '=== CHARSELECT SOUNDS ==='
          find official-v084 -type f | grep -Ei '/(sounds?|music)/.*(CS_|stayFunky|static loop)' | sort || true
          echo '=== ANIMATE METADATA ==='
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('official-v084/images/charSelect')
          for p in sorted(root.glob('*/Animation.json')):
              d=json.loads(p.read_text())
              print('\nFILE',p)
              print('ROOT_KEYS',list(d.keys()))
              print('AN',d.get('AN'))
              syms=d.get('SD',{}).get('S',[])
              for s in syms:
                  name=s.get('SN')
                  labels=[]
                  dur=0
                  for layer in s.get('TL',{}).get('L',[]):
                      for fr in layer.get('FR',[]):
                          dur=max(dur,int(fr.get('I',0))+int(fr.get('DU',1)))
                          if 'N' in fr or 'L' in fr:
                              labels.append({k:fr[k] for k in ('I','DU','N','L') if k in fr})
                  if labels or name in ['bfChill','gfChill','picoChill','crowd','charSelectStage','charSelectSpeakers','barThing']:
                      print(' SYMBOL',repr(name),'DUR',dur,'LABELS',labels[:30])
              print('FIRST_SYMBOLS',[(s.get('SN'), max([int(f.get('I',0))+int(f.get('DU',1)) for l in s.get('TL',{}).get('L',[]) for f in l.get('FR',[])] or [0])) for s in syms[:20]])
          PY
