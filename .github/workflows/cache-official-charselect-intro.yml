name: Cache Official v0.8.4 Character Select Intro

on:
  push:
    branches: [ menu-visual-parity-checkpoint ]
    paths: [ '.github/workflows/cache-official-charselect-intro.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download official Funkin v0.8.4 Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/funkin-linux-64bit.zip 'https://github.com/FunkinCrew/Funkin/releases/download/v0.8.4/funkin-linux-64bit.zip'
          echo '50eb30c89de03a6ef34431bb75930219b897aebb59e456a169247d8b0a414321  /tmp/funkin-linux-64bit.zip' | sha256sum -c -
      - name: Extract only official introSelect video
        run: |
          unzip -l /tmp/funkin-linux-64bit.zip | grep -Ei 'introSelect|videos/' | head -80
          path="$(unzip -Z1 /tmp/funkin-linux-64bit.zip | grep -Ei '(^|/)introSelect\.(mp4|webm|mov|ogv)$' | head -1)"
          test -n "$path"
          mkdir -p build/official-intro
          unzip -p /tmp/funkin-linux-64bit.zip "$path" > "build/official-intro/$(basename "$path")"
          test -s build/official-intro/introSelect.*
          sha256sum build/official-intro/introSelect.*
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json build/official-intro/introSelect.*
      - name: Cache on private assets-v084 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="$(find build/official-intro -type f -name 'introSelect.*' -print -quit)"
          gh release upload assets-v084 "$file" --repo "${GITHUB_REPOSITORY}" --clobber
