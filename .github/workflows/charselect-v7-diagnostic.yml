name: Character Select v7 Source Diagnostic

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths:
      - '.github/workflows/charselect-v7-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official v0.8.4 visual assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets \
            --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip'
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
      - name: Inspect renderer and exact Character Select sources
        run: |
          gzip -dc ci/charselect/build_v084_charselect_full.py.gz > /tmp/csbuilder.py
          echo '=== BUILDER FUNCTIONS ==='
          grep -n '^def ' /tmp/csbuilder.py || true
          echo '=== RENDER/TRAVERSAL CODE ==='
          grep -n -E 'render|collect|leaf|element|paste_anim|build_character|timeline|symbols' /tmp/csbuilder.py | head -120 || true
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          from PIL import Image

          root=Path('official-v084/images/charSelect')
          for rel in ['bfIcon.png','bfIcon.xml','boyfriendNametag.png','lockedNametag.png','charSelector.png','locks.png','locks.xml','placement.png','charSelectTemp.png']:
              p=root/rel
              print('\n===',rel,'===')
              print('exists',p.exists(),'bytes',p.stat().st_size if p.exists() else None)
              if p.suffix.lower()=='.png' and p.exists():
                  im=Image.open(p)
                  print('size',im.size,'mode',im.mode)
              elif p.exists():
                  text=p.read_text(encoding='utf-8-sig')
                  print(text[:8000])

          for target in ['lock','bfChill','gfChill']:
              p=root/target/'Animation.json'
              data=json.loads(p.read_text(encoding='utf-8-sig'))
              print('\n=== ANIMATE SUMMARY',target,'===')
              print('AN',data.get('AN',{}).get('SN'),data.get('AN',{}).get('STI'))
              symbols=data.get('SD',{}).get('S',[])
              print('symbols',len(symbols))
              for s in symbols[:20]:
                  print('symbol',s.get('SN'),'layers',[l.get('LN') for l in s.get('TL',{}).get('L',[])])

          # Print exact source around the builder's hierarchy traversal functions.
          text=Path('/tmp/csbuilder.py').read_text()
          lines=text.splitlines()
          for needle in ['def collect_symbol_leaves','def render_bta_frame','def paste_anim','def build_character_overlay','def load_optional_anim']:
              for i,line in enumerate(lines):
                  if line.startswith(needle):
                      print('\n===',needle,'line',i+1,'===')
                      print('\n'.join(lines[i:min(len(lines),i+180)]))
                      break
          PY
