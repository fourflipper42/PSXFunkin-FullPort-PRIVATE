name: Character Select v7 Source Diagnostic

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths:
      - '.github/workflows/charselect-v7-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: sudo apt-get update -qq && sudo apt-get install -y python3-pil
      - name: Fetch official v0.8.4 visual assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets \
            --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip'
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
      - name: Compare Animate hierarchy traversal orders
        run: |
          gzip -dc ci/charselect/build_v084_charselect_full.py.gz > /tmp/csbuilder.py
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, sys
          from PIL import Image, ImageChops, ImageStat

          sys.path.insert(0, str(Path('scripts').resolve()))
          root=Path('official-v084/images/charSelect')
          src=Path('/tmp/csbuilder.py').read_text()
          layer_rev='for layer in reversed(symbol.get("TL", {}).get("L", [])):'
          layer_fwd='for layer in symbol.get("TL", {}).get("L", []):'
          elem_rev='for element in reversed(fr.get("E", [])):'
          elem_fwd='for element in fr.get("E", []):'
          assert layer_rev in src and elem_rev in src

          def load(name,text):
              p=Path('/tmp')/(name+'.py'); p.write_text(text)
              spec=importlib.util.spec_from_file_location(name,p)
              m=importlib.util.module_from_spec(spec); sys.modules[name]=m; spec.loader.exec_module(m); return m

          variants={}
          for lr in (True,False):
              for er in (True,False):
                  text=src
                  if not lr: text=text.replace(layer_rev,layer_fwd)
                  if not er: text=text.replace(elem_rev,elem_fwd)
                  name=f"cs_l{'r' if lr else 'f'}_e{'r' if er else 'f'}"
                  variants[(lr,er)]=load(name,text)

          ref=Image.open(root/'bfChill.png').convert('RGBA')
          def crop_alpha(im):
              a=im.getchannel('A')
              b=a.getbbox()
              return im.crop(b) if b else im
          refc=crop_alpha(ref)
          print('BF_REFERENCE',ref.size,refc.size)

          results=[]
          for (lr,er),m in variants.items():
              a=m.load_animate(root/'bfChill')
              # Test several frames. bfChill.png is only a static guide, so frame 0 is the primary comparison.
              frame_errors=[]
              for fr in (0,1,2,3):
                  im,ox,oy=m.render_symbol(a,fr)
                  c=crop_alpha(im.convert('RGBA'))
                  n=c.resize(refc.size,Image.Resampling.LANCZOS)
                  errs=[]
                  for bg in [(0,0,0,255),(255,255,255,255)]:
                      rb=Image.new('RGBA',refc.size,bg); rb.alpha_composite(refc)
                      nb=Image.new('RGBA',refc.size,bg); nb.alpha_composite(n)
                      st=ImageStat.Stat(ImageChops.difference(rb.convert('RGB'),nb.convert('RGB')))
                      errs.append(sum(v*v for v in st.rms)**0.5)
                  frame_errors.append(sum(errs)/len(errs))
                  if fr==0:
                      c.save(f'/tmp/traversal_l{"r" if lr else "f"}_e{"r" if er else "f"}.png')
                      print('VARIANT',lr,er,'render',im.size,'offset',ox,oy,'crop',c.size,'frame0_rmse',frame_errors[-1])
              results.append((frame_errors[0],lr,er,frame_errors))
          print('ORDERED_RESULTS')
          for r in sorted(results): print(r)

          # Basic source metadata needed by v7.
          print('BF_ICON_XML')
          print((root/'bfIcon.xml').read_text(encoding='utf-8-sig'))
          print('NAMETAG',Image.open(root/'boyfriendNametag.png').size)
          print('SELECTOR',Image.open(root/'charSelector.png').size)
          print('PLACEMENT',Image.open(root/'placement.png').size)
          PY
