name: Character Select v7 Source Diagnostic

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths:
      - '.github/workflows/charselect-v7-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: sudo apt-get update -qq && sudo apt-get install -y python3-pil
      - name: Fetch official v0.8.4 visual assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets \
            --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip'
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
      - name: Inspect renderer and exact Character Select sources
        run: |
          gzip -dc ci/charselect/build_v084_charselect_full.py.gz > /tmp/csbuilder.py
          echo '=== COLLECT/RENDER SOURCE ==='
          sed -n '250,330p' /tmp/csbuilder.py
          echo '=== LIVE SCENE SOURCE ==='
          sed -n '388,452p' /tmp/csbuilder.py
          python3 - <<'PY'
          from pathlib import Path
          import json, importlib.util, sys, shutil, math
          from PIL import Image, ImageChops, ImageStat

          root=Path('official-v084/images/charSelect')
          for rel in ['bfChill.png','bfIcon.png','bfIcon.xml','boyfriendNametag.png','lockedNametag.png','charSelector.png','locks.png','locks.xml','placement.png','charSelectTemp.png']:
              p=root/rel
              print('\n===',rel,'===')
              print('exists',p.exists(),'bytes',p.stat().st_size if p.exists() else None)
              if p.suffix.lower()=='.png' and p.exists():
                  im=Image.open(p)
                  print('size',im.size,'mode',im.mode,'bbox',im.convert('RGBA').getbbox())
              elif p.exists():
                  print(p.read_text(encoding='utf-8-sig')[:12000])

          for target in ['lock','bfChill','gfChill']:
              p=root/target/'Animation.json'
              data=json.loads(p.read_text(encoding='utf-8-sig'))
              print('\n=== ANIMATE SUMMARY',target,'===')
              symbols=data.get('SD',{}).get('S',[])
              for s in symbols[:40]:
                  print('symbol',s.get('SN'),'layers',[l.get('LN') for l in s.get('TL',{}).get('L',[])])

          # Compare current reversed-element renderer with natural element order against bfChill.png.
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              m=importlib.util.module_from_spec(spec); sys.modules[name]=m; spec.loader.exec_module(m); return m
          current=load('cs_current','/tmp/csbuilder.py')
          forward_path='/tmp/csbuilder_forward.py'
          txt=Path('/tmp/csbuilder.py').read_text()
          old='for element in reversed(fr.get("E", [])):'
          assert old in txt
          Path(forward_path).write_text(txt.replace(old,'for element in fr.get("E", []):'))
          forward=load('cs_forward',forward_path)
          ref=Image.open(root/'bfChill.png').convert('RGBA')
          def crop(im):
              b=im.getbbox(); return im.crop(b) if b else im
          refc=crop(ref)
          print('\nBF reference crop',refc.size)
          for label,m in [('reversed',current),('forward',forward)]:
              a=m.load_animate(root/'bfChill')
              im,ox,oy=m.render_symbol(a,0)
              c=crop(im.convert('RGBA'))
              # Normalize each candidate to reference dimensions only for structural RMSE comparison.
              n=c.resize(refc.size,Image.Resampling.LANCZOS)
              # ignore fully transparent pixels by compositing both on black and white, average errors
              errs=[]
              for bg in [(0,0,0,255),(255,255,255,255)]:
                  rb=Image.new('RGBA',refc.size,bg); rb.alpha_composite(refc)
                  nb=Image.new('RGBA',refc.size,bg); nb.alpha_composite(n)
                  st=ImageStat.Stat(ImageChops.difference(rb.convert('RGB'),nb.convert('RGB')))
                  errs.append(sum(v*v for v in st.rms)**0.5)
              print(label,'render',im.size,'offset',ox,oy,'crop',c.size,'rmse',sum(errs)/len(errs))
          PY
