name: PSXFunkin Full Port Completion - LE SSERAFIM v1

on:
  push:
    branches: [ full-port-completion ]
    paths:
      - '.github/workflows/charselect-v7-1-build.yml'
      - 'scripts/build_charselect_v7_1_cleanup.py'
      - 'scripts/apply_charselect_v7_1_cleanup.py'
      - 'scripts/build_freeplay_parity_v1.py'
      - 'scripts/apply_freeplay_parity_v1.py'
      - 'scripts/build_pause_audio.py'
      - 'scripts/apply_pause_menu_v1.py'
      - 'scripts/build_base_weeks_v1.py'
      - 'scripts/apply_base_weeks_v1.py'
      - 'scripts/build_console_options_v1.py'
      - 'scripts/apply_console_options_v1.py'
      - 'scripts/build_weekend1_assets.py'
      - 'scripts/build_weekend1_audio.py'
      - 'scripts/build_weekend1_charts.py'
      - 'scripts/build_weekend1_movies.py'
      - 'scripts/psxfunkin_chartc_weekend1.py'
      - 'scripts/apply_weekend1_v2.py'
      - 'scripts/build_sserafim_assets.py'
      - 'scripts/build_sserafim_audio.py'
      - 'scripts/build_sserafim_charts.py'
      - 'scripts/build_sserafim_movies.py'
      - 'scripts/apply_sserafim_v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ps1-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Expand proven Character Select sources
        run: |
          gzip -dc ci/charselect/build_v084_charselect_full.py.gz > scripts/build_v084_charselect_full.py
          gzip -dc ci/charselect/apply_v084_charselect_full.py.gz > scripts/apply_v084_charselect_full.py
          echo 'aefbdec3e9bb0d020a2e525d0fec6fdb5182445515245a622b92d37b8ed0f051  scripts/build_v084_charselect_full.py' | sha256sum -c -
          echo 'f36376bd0949f1f3d2b2a0ec31a9bebccd8a29df24aff82627c8f4ff5895097e  scripts/apply_v084_charselect_full.py' | sha256sum -c -
          python3 scripts/fix_charselect_intro_extraction.py scripts/build_v084_charselect_full.py
          python3 scripts/fix_charselect_parity_v3.py scripts/build_v084_charselect_full.py scripts/apply_v084_charselect_full.py
          python3 -m py_compile \
            scripts/build_v084_charselect_full.py \
            scripts/apply_v084_charselect_full.py \
            scripts/fix_charselect_ram_runtime_v3.py \
            scripts/build_charselect_quality_v4.py \
            scripts/apply_charselect_quality_v4.py \
            scripts/build_charselect_quality_v5.py \
            scripts/apply_charselect_quality_v5.py \
            scripts/build_charselect_exact_ui_v6.py \
            scripts/build_charselect_exact_ui_v6_fixed.py \
            scripts/apply_charselect_exact_ui_v6.py \
            scripts/build_charselect_source_v7.py \
            scripts/run_charselect_source_v7.py \
            scripts/apply_charselect_source_v7.py \
            scripts/build_charselect_v7_1_cleanup.py \
            scripts/apply_charselect_v7_1_cleanup.py \
            scripts/build_freeplay_parity_v1.py \
            scripts/apply_freeplay_parity_v1.py \
            scripts/build_pause_audio.py \
            scripts/apply_pause_menu_v1.py \
            scripts/build_base_weeks_v1.py \
            scripts/apply_base_weeks_v1.py \
            scripts/build_console_options_v1.py \
            scripts/apply_console_options_v1.py \
            scripts/build_weekend1_assets.py \
            scripts/build_weekend1_audio.py \
            scripts/build_weekend1_charts.py \
            scripts/build_weekend1_movies.py \
            scripts/psxfunkin_chartc_weekend1.py \
            scripts/apply_weekend1_v2.py \
            scripts/build_sserafim_assets.py \
            scripts/build_sserafim_audio.py \
            scripts/build_sserafim_charts.py \
            scripts/build_sserafim_movies.py \
            scripts/apply_sserafim_v1.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl unzip cmake ninja-build pkg-config meson python3-pil \
            gcc-mipsel-linux-gnu g++-mipsel-linux-gnu binutils-mipsel-linux-gnu \
            ffmpeg libavformat-dev libavfilter-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev libtinyxml2-dev

      - name: Fetch exact upstream baseline
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://codeload.github.com/cuckydev/PSXFunkin/tar.gz/850e0207479d8fb658bdc7637f6bfbc28a2b4066 \
            -o /tmp/psxfunkin-upstream.tar.gz
          mkdir -p /tmp/psxfunkin-upstream
          tar -xzf /tmp/psxfunkin-upstream.tar.gz -C /tmp/psxfunkin-upstream --strip-components=1
          mv /tmp/psxfunkin-upstream upstream
          git -C upstream init
          git -C upstream config user.name ci
          git -C upstream config user.email ci@example.invalid
          git -C upstream add -A
          git -C upstream commit -q -m 'Exact cuckydev 850e020 baseline'
          git -C upstream apply ../patches/0001-current-difficulties.patch
          git -C upstream diff --check

      - name: Fetch official v0.8.4 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084 build
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets \
            --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip' \
            --pattern 'Sounds.and.Songs.zip'
          echo 'd02d2ea24f9d5b032012a69ab533f724ee5cd364093e693f21d17bd3abfccc37  official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip' | sha256sum -c -
          echo '042d0ecd29a5356b4c17e750118a52485ee69466e8f1da02fed057c4abd98dc7  official-assets/Sounds.and.Songs.zip' | sha256sum -c -
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
          unzip -qo official-assets/Sounds.and.Songs.zip -d official-v084
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/FunkinCrew/Funkin/releases/download/v0.8.4/funkin-linux-64bit.zip \
            -o official-assets/funkin-linux-64bit.zip
          echo '50eb30c89de03a6ef34431bb75930219b897aebb59e456a169247d8b0a414321  official-assets/funkin-linux-64bit.zip' | sha256sum -c -
          mkdir -p official-v084/videos
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil, zipfile
          with zipfile.ZipFile('official-assets/funkin-linux-64bit.zip') as z:
              names=[n for n in z.namelist() if 'introselect' in PurePosixPath(n).name.lower() and PurePosixPath(n).suffix.lower() in {'.mp4','.webm','.ogv','.mkv'}]
              if not names: raise SystemExit('introSelect missing from official v0.8.4 release')
              name=sorted(names,key=lambda n:(len(n),n))[0]
              out=Path('official-v084/videos')/PurePosixPath(name).name
              with z.open(name) as src, out.open('wb') as dst: shutil.copyfileobj(src,dst)
              breakfast=[n for n in z.namelist() if PurePosixPath(n).name.lower()=='breakfast.ogg' and '/shared/music/' in ('/'+n.lower())]
              if not breakfast: raise SystemExit('Breakfast pause music missing from official v0.8.4 release')
              name=sorted(breakfast,key=lambda n:(0 if n.lower().endswith('/assets/shared/music/breakfast.ogg') else 1,len(n),n))[0]
              out=Path('official-v084/assets/shared/music/breakfast.ogg')
              out.parent.mkdir(parents=True,exist_ok=True)
              with z.open(name) as src, out.open('wb') as dst: shutil.copyfileobj(src,dst)
              for video_name in ('darnellCutscene.mp4','2hotCutscene.mp4','blazinCutscene.mp4'):
                  matches=[n for n in z.namelist() if PurePosixPath(n).name.lower()==video_name.lower()]
                  if not matches: raise SystemExit(f'official Weekend 1 video missing: {video_name}')
                  name=sorted(matches,key=lambda n:(len(n),n))[0]
                  out=Path('official-v084/videos/videos')/video_name
                  out.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(name) as src, out.open('wb') as dst: shutil.copyfileobj(src,dst)
              for suffix in (
                  'assets/week5/images/christmas/evilBG.png',
                  'assets/week5/images/christmas/evilTree.png',
                  'assets/week5/images/christmas/evilSnow.png',
                  'assets/images/icons/icon-bf.png',
              ):
                  matches=[n for n in z.namelist() if n.lower().endswith(suffix.lower())]
                  if not matches: raise SystemExit(f'official Week 5 source missing: {suffix}')
                  name=sorted(matches,key=lambda n:(len(n),n))[0]
                  out=Path('official-v084')/suffix
                  out.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(name) as src, out.open('wb') as dst: shutil.copyfileobj(src,dst)

              # The split asset release omits several executable-bundled collab
              # files and the Weekend street car sheet. Recover those exact
              # official v0.8.4 bytes from the same pinned Linux release.
              icon_names={'icon-bf.png','icon-gf.png','icon-yunjin.png','icon-kazuha.png','icon-chaewon.png','icon-eunchae.png','icon-sakura.png'}
              def required_asset(name):
                  low=name.lower()
                  base=PurePosixPath(name).name.lower()
                  return (
                      low.startswith('assets/sserafim/') or
                      low.startswith('assets/shared/images/characters/sserafim/') or
                      low.startswith('assets/data/songs/spaghetti/') or
                      low.startswith('assets/data/characters/sserafim-') or
                      low in {'assets/data/stages/sserafim.json','assets/data/levels/sserafim.json'} or
                      low in {
                          'assets/weekend1/images/phillystreets/phillycars.png',
                          'assets/weekend1/images/phillystreets/phillycars.xml',
                          'assets/weekend1/images/phillystreets/phillytraffic.png',
                          'assets/weekend1/images/phillystreets/phillytraffic.xml',
                      } or
                      (low.startswith('assets/images/icons/') and base in icon_names)
                  )
              extracted=0
              for name in z.namelist():
                  if not required_asset(name): continue
                  relative=PurePosixPath(name).relative_to('assets')
                  out=Path('official-v084').joinpath(*relative.parts)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(name) as src, out.open('wb') as dst: shutil.copyfileobj(src,dst)
                  extracted+=1
              if extracted < 60:
                  raise SystemExit(f'official Weekend/LE SSERAFIM extraction incomplete: {extracted} files')
          PY

      - name: Fetch pinned PSXFunkin base-week conversion reference
        run: |
          curl -fL --retry 3 --retry-delay 3 \
            https://codeload.github.com/Nintendo-Bro385/PSXFunkin-Flop-Engine/tar.gz/b3f4c5ff0f7656af8ed17498de6b6d7b7a8d967e \
            -o /tmp/psx-week-reference.tar.gz
          echo '5853b706dc2b54677f9f659f206d0ce2eb7ca2c4aa88b66a492d50134a7bfbe0  /tmp/psx-week-reference.tar.gz' | sha256sum -c -
          mkdir -p psx-week-reference
          tar -xzf /tmp/psx-week-reference.tar.gz -C psx-week-reference --strip-components=1
          test -s psx-week-reference/iso/week5/back0.png
          test -s psx-week-reference/iso/week6/back3.png
          test -s psx-week-reference/src/character/spirit.c

      - name: Build PS1 XA encoder
        run: |
          git clone --depth=1 https://github.com/WonderfulToolchain/psxavenc.git psxavenc
          meson setup psxavenc/build psxavenc --buildtype=release
          meson compile -C psxavenc/build
          test -x psxavenc/build/psxavenc

      - name: Rebuild confirmed charts and Erect audio
        run: |
          python3 scripts/build_v084_legacy_charts.py --data-root official-v084 --iso-root upstream/iso --manifest build/v084_charts.json
          python3 scripts/add_v084_chart_entries.py upstream/funkin.xml
          python3 scripts/build_erect_audio.py \
            --root official-v084 --out upstream/iso/music --psxavenc psxavenc/build/psxavenc \
            --header upstream/src/erect_audio_generated.h --report build/erect_audio.json
          python3 scripts/apply_erect_audio_routing.py upstream
          git -C upstream diff --check

      - name: Reapply confirmed menu and Freeplay baseline
        run: |
          python3 scripts/apply_v084_menu_foundation.py upstream
          python3 scripts/finalize_v084_menu_foundation.py upstream
          python3 scripts/build_v084_menu_visual_assets.py --assets-root official-v084 --upstream upstream --report build/menu_visual_sources.json
          python3 scripts/replace_freeplay_bf_with_official_dj.py --assets-root official-v084 --upstream upstream --report build/menu_visual_sources.json
          python3 scripts/apply_v084_menu_visual_parity.py upstream
          python3 scripts/fix_v084_menu_visual_feedback.py upstream
          grep -q 'MENU_DJ_FRAME_COUNT 14' upstream/src/menu.c
          git -C upstream diff --check

      - name: Rebuild proven Character Select source and fixed XA
        run: |
          INTRO="$(find official-v084/videos -type f -iname 'introSelect*' -print -quit)"
          test -n "$INTRO"
          python3 scripts/build_v084_charselect_full.py \
            --assets-root official-v084 --upstream upstream --report build/menu_visual_sources.json \
            --intro-video "$INTRO" --psxavenc psxavenc/build/psxavenc
          python3 scripts/apply_v084_charselect_full.py upstream
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/src/menu.c'); s=p.read_text(); bad='Menu_SetCSFrame(MENU_CS_IDLE_FIRST);'
          if s.count(bad) != 1: raise SystemExit(f'expected one stale idle symbol, found {s.count(bad)}')
          p.write_text(s.replace(bad, 'Menu_SetCSFrame(MENU_CS_INTRO_FIRST + 24);'))
          PY
          python3 scripts/fix_charselect_ram_runtime_v3.py upstream
          test "$(stat -c%s upstream/iso/music/charsel.xa)" -eq 22425600
          git -C upstream diff --check

      - name: Rebuild v4-v6 visual bases
        run: |
          python3 scripts/build_charselect_quality_v4.py --builder scripts/build_v084_charselect_full.py --assets-root official-v084 --upstream upstream --report build/menu_visual_sources.json
          python3 scripts/apply_charselect_quality_v4.py upstream
          python3 scripts/build_charselect_quality_v5.py --builder scripts/build_v084_charselect_full.py --assets-root official-v084 --upstream upstream --report build/menu_visual_sources.json
          python3 scripts/apply_charselect_quality_v5.py upstream
          python3 scripts/build_charselect_exact_ui_v6_fixed.py --builder scripts/build_v084_charselect_full.py --assets-root official-v084 --upstream upstream --report build/menu_visual_sources.json
          python3 scripts/apply_charselect_exact_ui_v6.py upstream
          git -C upstream diff --check

      - name: Rebuild proven source-correct v7 hierarchy
        run: |
          python3 scripts/run_charselect_source_v7.py --builder scripts/build_v084_charselect_full.py --assets-root official-v084 --upstream upstream --report build/menu_visual_sources.json
          python3 scripts/apply_charselect_source_v7.py upstream
          git -C upstream diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/menu_visual_sources.json').read_text())['character_select_source_v7']
          assert r['animate_traversal']=='layers reversed, elements forward'
          assert r['bf_reference_rmse'] < 115
          assert r['background']['frames'] >= 6
          assert Path('upstream/iso/music/charsel.xa').stat().st_size == 22425600
          print('V7_HIERARCHY_FROZEN_OK')
          PY

      - name: Build and apply focused v7.1 cleanup
        run: |
          INTRO="$(find official-v084/videos -type f -iname 'introSelect*' -print -quit)"
          test -n "$INTRO"
          python3 scripts/build_charselect_v7_1_cleanup.py \
            --builder scripts/build_v084_charselect_full.py --assets-root official-v084 \
            --upstream upstream --report build/menu_visual_sources.json --intro-video "$INTRO"
          python3 scripts/apply_charselect_v7_1_cleanup.py upstream
          git -C upstream diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('build/menu_visual_sources.json').read_text())
          v7=data['character_select_source_v7']; r=data['character_select_v7_1_cleanup']
          assert v7['animate_traversal']=='layers reversed, elements forward'
          assert r['font_vram']['audit']=='pass'
          assert r['font_vram']['clut']==[0,511,16,1]
          assert r['font_vram']['control_clut_relocated_to']==[256,511]
          assert r['intro']['frames']==24 and r['intro']['packed_bytes'] > 0
          assert 'bfpixel' in r['controls']['icon_path'].lower()
          assert r['controls']['icon_unselected_dst'][2:]==[43,43]
          assert r['controls']['icon_selected_dst'][2:]==[56,56]
          vals=list(Path('build/charselect_v7_1_validation').glob('state_*.png'))
          assert len(vals)==9, len(vals)
          for name in ['csintro71.rle','cslock71a.tim','cslock71b.tim','csctrl71a.tim','csctrl71b.tim']:
              p=Path('upstream/iso/menu',name); assert p.is_file() and p.stat().st_size > 0, name
          menu=Path('upstream/src/menu.c').read_text().lower()
          for marker in ['charselect_v7_1_generated.h','menu_csdrawv71locks','menu_csdrawv71intro','fontdata_load(&menu.font_bold, font_bold)','csintro71.rle;1']:
              assert marker in menu, marker
          assert 'menu_csdrawv7gridpages();' not in menu
          assert Path('upstream/iso/music/charsel.xa').stat().st_size == 22425600
          print('V7_1_FULL_SOURCE_VALIDATION_OK')
          print(json.dumps(r,indent=2))
          PY

      - name: Build and apply official Freeplay parity v1
        run: |
          mkdir -p build/freeplay-v1-validation
          python3 scripts/build_freeplay_parity_v1.py \
            --assets-root official-v084 --upstream upstream \
            --report build/freeplay_parity_v1.json \
            --validation-dir build/freeplay-v1-validation
          python3 scripts/apply_freeplay_parity_v1.py upstream
          git -C upstream diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/freeplay_parity_v1.json').read_text())
          assert report['policy'].startswith('official-v0.8.4-existing-files-only')
          assert report['animation']['selected_capsules']==8
          assert report['animation']['unselected_capsules']==8
          assert report['animation']['selectors']==15
          assert len(report['metadata']['entries'])==20
          for name in ('fpanim.tim','fpmeta.tim','fpdj.bin'):
              path=Path('upstream/iso/menu',name)
              assert path.is_file() and path.stat().st_size > 0, name
          menu=Path('upstream/src/menu.c').read_text().lower()
          for marker in ('menu_fp_song_count 22','menu_freeplaytickpreview','pad_select','pad_l1','pad_r1','charselect_v7_1_generated.h'):
              assert marker in menu, marker
          assert menu.count('case menupage_characterselect:')==1
          print('FREEPLAY_PARITY_V1_VALIDATION_OK')
          PY

      - name: Build and apply base Funkin pause menu v1
        run: |
          python3 scripts/build_pause_audio.py \
            --assets-root official-v084 \
            --out upstream/iso/music/pause.xa \
            --psxavenc psxavenc/build/psxavenc \
            --font-template upstream/iso/font/boldfont.tim \
            --font-out upstream/iso/font/pausef.tim \
            --report build/pause_menu_v1.json
          python3 scripts/apply_pause_menu_v1.py upstream
          git -C upstream diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/pause_menu_v1.json').read_text())
          assert report['policy']=='official-v0.8.4-breakfast-audio-only'
          assert report['source_sha256']=='ef98010b857f8dcd5083417a6ebfe81ad473b47f2e331e5e5403e0f3bba935d8'
          assert report['xa_bytes'] > 0 and report['xa_bytes'] % 2336 == 0
          assert report['pause_font']['clut']==[256,511,16,1]
          for path in ('upstream/iso/music/pause.xa','upstream/iso/font/pausef.tim'):
              assert Path(path).is_file() and Path(path).stat().st_size > 0, path
          joined='\n'.join(Path('upstream/src',name).read_text().lower() for name in ('stage.c','stage.h','audio.c','audio.h','gfx.c','gfx.h','font.c','font.h'))
          for marker in ('stagestate_pause','audio_savexa','audio_restorexa','audio_playxa_offset','stage_pausedraw','enable practice mode'):
              assert marker in joined, marker
          assert 'pause.xa' in Path('upstream/funkin.xml').read_text().lower()
          assert 'pausef.tim' in Path('upstream/funkin.xml').read_text().lower()
          print('PAUSE_MENU_V1_VALIDATION_OK')
          PY

      - name: Build and apply authentic base Weeks 2 5 and 6 v1
        run: |
          mkdir -p build/base-weeks-v1-validation
          python3 scripts/build_base_weeks_v1.py \
            --reference-root psx-week-reference \
            --official-root official-v084 \
            --upstream upstream \
            --report build/base_weeks_v1.json \
            --validation-dir build/base-weeks-v1-validation
          python3 scripts/apply_base_weeks_v1.py upstream --reference-root psx-week-reference
          git -C upstream diff --check
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          report=json.loads(Path('build/base_weeks_v1.json').read_text())
          assert report['policy']=='authentic-funkin-art-only-no-generated-art'
          assert report['reference']['commit']=='b3f4c5ff0f7656af8ed17498de6b6d7b7a8d967e'
          assert report['converted_tim_count']==45
          assert len(report['christmas_parents']['mapping'])==20
          assert report['christmas_parents']['archive_bytes'] < 200000
          for path in (
              'upstream/iso/monster/main.arc', 'upstream/iso/week5/back.arc',
              'upstream/iso/week5/evil.tim', 'upstream/iso/xmasp/main.arc',
              'upstream/iso/week6/back.arc', 'upstream/iso/week6/back3.tim',
              'upstream/iso/gf/weeb.arc', 'upstream/iso/spirit/main.arc',
          ):
              file=Path(path); assert file.is_file() and file.stat().st_size > 0, path
          stagedef=Path('upstream/src/stagedef_disc1.h').read_text().lower()
          for marker in ('char_monster_new','back_week5_new','back_week5evil_new','char_xmasp_new','back_week6_new','char_gfweeb_new','char_senpaim_new','char_spirit_new'):
              assert marker in stagedef, marker
          xml=Path('upstream/funkin.xml').read_text()
          long_names=[name for name in re.findall(r'<file name = "([^"]+)"',xml) if len(name)>12]
          assert not long_names, long_names
          print('BASE_WEEKS_2_5_6_V1_VALIDATION_OK')
          PY

      - name: Build and apply console Options Memory Card and Freeplay records v1
        run: |
          mkdir -p build/console-options-v1-validation
          python3 scripts/build_console_options_v1.py \
            --assets-root official-v084 \
            --header upstream/src/settings_icon_generated.h \
            --report build/console_options_v1.json \
            --validation build/console-options-v1-validation/memory-card-icon.png
          python3 scripts/apply_console_options_v1.py upstream
          git -C upstream diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/console_options_v1.json').read_text())
          assert report['policy']=='official-v0.8.4-boyfriend-health-icon-only'
          assert report['source_sha256']=='fe5b3e95eab2cfa20eb6c04645df46a84180536a8184dd0caee01d584ddf18c6'
          assert report['icon_dimensions']==[16,16]
          assert report['palette_bytes']==32 and report['pixel_bytes']==128
