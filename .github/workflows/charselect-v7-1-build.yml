      - name: Acquire PsyQ compatibility libraries
        run: |
          rm -rf /tmp/psyq-extract upstream/mips/psyq
          mkdir -p /tmp/psyq-extract upstream/mips/psyq
          curl -fL --retry 3 --retry-delay 2 http://psx.arthus.net/sdk/Psy-Q/psyq-4_7-converted-light.zip -o /tmp/psyq.zip
          unzip -q /tmp/psyq.zip -d /tmp/psyq-extract
          INC="$(find /tmp/psyq-extract -type d -name include -print -quit)"
          LIB="$(find /tmp/psyq-extract -type d -name lib -print -quit)"
          test -n "$INC"; test -n "$LIB"
          cp -a "$INC" upstream/mips/psyq/include
          cp -a "$LIB" upstream/mips/psyq/lib

      - name: Build mkpsxiso
        run: |
          git clone --depth=1 --recursive https://github.com/CookiePLMonster/mkpsxiso.git mkpsxiso
          git -C mkpsxiso submodule update --init --recursive --depth=1
          cmake -S mkpsxiso -B mkpsxiso/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build mkpsxiso/build
          cmake --install mkpsxiso/build

      - name: Compile PSXFunkin
        working-directory: upstream
        run: |
          make clean || true
          make -j2
          test -s funkin.ps-exe
          sha256sum funkin.ps-exe

      - name: Build MODE2/2352 disc
        working-directory: upstream
        run: |
          sed -i '/<license file="licensea.dat"\/>/d' funkin.xml
          "$HOME/.local/bin/mkpsxiso" -y funkin.xml
          test -s funkin.bin && test -s funkin.cue
          test "$(( $(stat -c%s funkin.bin) % 2352 ))" -eq 0
          sectors=$(( $(stat -c%s funkin.bin) / 2352 ))
          echo "Raw disc sectors: $sectors"
          test "$sectors" -le 360000

      - name: Package LE SSERAFIM v1 checkpoint
        run: |
          mkdir -p build/release/v7-1-validation build/release/freeplay-v1-validation build/release/base-weeks-v1-validation build/release/console-options-v1-validation build/release/sserafim-v1-validation
          cp upstream/funkin.bin build/release/PSXFunkin_v084_LE_SSERAFIM_v1.bin
          cat > build/release/PSXFunkin_v084_LE_SSERAFIM_v1.cue <<'EOF'
          FILE "PSXFunkin_v084_LE_SSERAFIM_v1.bin" BINARY
            TRACK 01 MODE2/2352
            INDEX 01 00:00:00
          EOF
          cp upstream/funkin.ps-exe build/release/
          cp build/menu_visual_sources.json build/erect_audio.json build/v084_charts.json build/freeplay_parity_v1.json build/pause_menu_v1.json build/base_weeks_v1.json build/console_options_v1.json build/weekend1_assets_v2.json build/weekend1_charts_v2.json build/weekend1_audio_v2.json build/weekend1_movies_v2.json build/sserafim_assets_v1.json build/sserafim_charts_v1.json build/sserafim_audio_v1.json build/sserafim_movies_v1.json build/release/
          cp build/charselect_v7_1_validation/*.png build/release/v7-1-validation/
          cp build/freeplay-v1-validation/*.png build/release/freeplay-v1-validation/
          cp build/base-weeks-v1-validation/*.png build/release/base-weeks-v1-validation/
          cp build/console-options-v1-validation/*.png build/release/console-options-v1-validation/
          cp upstream/build-sserafim/background/sserafim_preview.png build/release/sserafim-v1-validation/
          cat > build/release/LE_SSERAFIM_V1.txt <<'EOF'
          Official LE SSERAFIM collaboration v1 checkpoint
          - Character Select v7.1 visual hierarchy and audio are frozen unchanged.
          - Freeplay parity, the real pause menu, authentic base Weeks 2/5/6, and console Options/saves remain integrated.
          - Weekend 1 remains fully integrated with its four songs, official FMVs, in-engine intro/ending beats, event-driven cameras, street traffic, rain, lightning, can/gun notes, and Blazin' fight reactions.
          - SPAGHETTI uses the exact official v0.8.4 easy/normal/hard charts and all 468 official chart events.
          - Kazuha, Sakura, Yunjin, Chaewon, Eunchae, and the collaboration Girlfriend use authentic official source frames converted to native PS1 TIM archives.
          - Sakura's joint/BF1/BF2 note styles and miss animations, GF's Beautiful styles, group singing handoffs, health-icon swaps, camera/zoom/bop events, diner lighting, dust, darkness, covers, flashes, pulses, door kicks, and guitar vibration are active.
          - The exact licensed Inst and Sakura vocal Ogg streams are recovered byte-for-byte from the official v0.8.4 Linux executable and converted to resumable two-channel CD-XA.
          - The official cutscene timeline, audio, and artwork are pre-rendered into PS1 STR intro and ending movies.
          EOF
          (cd build/release && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          sha256sum build/release/PSXFunkin_v084_LE_SSERAFIM_v1.bin
          stat -c '%n %s bytes' build/release/PSXFunkin_v084_LE_SSERAFIM_v1.bin

