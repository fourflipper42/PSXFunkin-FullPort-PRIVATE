      - name: Persist CI outcome for checkpoint monitoring
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          SHORT="${GITHUB_SHA:0:12}"
          STATUS_PATH="ci-status/sserafim-v1-${SHORT}-attempt-${GITHUB_RUN_ATTEMPT}.json"
          export SHORT STATUS_PATH
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload={
              'workflow':'Official LE SSERAFIM collaboration v1',
              'status':os.environ['JOB_STATUS'],
              'sha':os.environ['GITHUB_SHA'],
              'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
          }
          Path('/tmp/sserafim-ci-status.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
          CONTENT="$(base64 -w0 /tmp/sserafim-ci-status.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" \
            -f message="Record official LE SSERAFIM v1 CI ${JOB_STATUS}" \
            -f content="$CONTENT" \
            -f branch="full-port-completion"
