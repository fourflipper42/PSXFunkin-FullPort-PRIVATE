      - name: Acquire PsyQ compatibility libraries
        run: |
          rm -rf /tmp/psyq-extract upstream/mips/psyq
          mkdir -p /tmp/psyq-extract upstream/mips/psyq
          curl -fL --retry 3 --retry-delay 2 http://psx.arthus.net/sdk/Psy-Q/psyq-4_7-converted-light.zip -o /tmp/psyq.zip
          unzip -q /tmp/psyq.zip -d /tmp/psyq-extract
          INC="$(find /tmp/psyq-extract -type d -name include -print -quit)"
          LIB="$(find /tmp/psyq-extract -type d -name lib -print -quit)"
          test -n "$INC"; test -n "$LIB"
          cp -a "$INC" upstream/mips/psyq/include
          cp -a "$LIB" upstream/mips/psyq/lib

      - name: Build mkpsxiso
        run: |
          git clone --depth=1 --recursive https://github.com/CookiePLMonster/mkpsxiso.git mkpsxiso
          git -C mkpsxiso submodule update --init --recursive --depth=1
          cmake -S mkpsxiso -B mkpsxiso/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build mkpsxiso/build
          cmake --install mkpsxiso/build

      - name: Compile PSXFunkin
        working-directory: upstream
        run: |
          make clean || true
          make -j2
          test -s funkin.ps-exe
          sha256sum funkin.ps-exe

      - name: Build MODE2/2352 disc
        working-directory: upstream
        run: |
          sed -i '/<license file="licensea.dat"\/>/d' funkin.xml
          "$HOME/.local/bin/mkpsxiso" -y funkin.xml
          test -s funkin.bin && test -s funkin.cue
          test "$(( $(stat -c%s funkin.bin) % 2352 ))" -eq 0
          sectors=$(( $(stat -c%s funkin.bin) / 2352 ))
          echo "Raw disc sectors: $sectors"
          test "$sectors" -le 360000

      - name: Boot Weekend 1 cutscene and stage RAM smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/weekend-production build/weekend-runtime-smoke
          cp upstream/funkin.ps-exe upstream/funkin.bin upstream/funkin.cue /tmp/weekend-production/
          cp upstream/src/main.c /tmp/weekend-production/main.c
          python3 - <<'PY'
          from pathlib import Path
          path=Path('upstream/src/main.c')
          text=path.read_text()
          old='\t//Start game\n\tgameloop = GameLoop_Menu;\n\tMenu_Load(MenuPage_Opening);'
          new=('\t/* CI_WEEKEND1_RUNTIME_SMOKE: movie return plus the complete stage heap. */\n'
               '\tgameloop = GameLoop_Stage;\n'
               '\tLoadScr_Start();\n'
               '\tStage_Load(StageId_8_1, StageDiff_Normal, true);\n'
               '\tLoadScr_End();')
          if text.count(old)!=1:
              raise SystemExit(f'Weekend runtime smoke main anchor changed: {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          make -C upstream clean || true
          make -C upstream -j2
          (cd upstream && "$HOME/.local/bin/mkpsxiso" -y funkin.xml)

          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced/releases/download/r7370.3e10093a-1%402026-08-01_1785584896/PCSX-Redux-r7370.3e10093a-1-anylinux-x86_64.AppImage' \
            -o pcsx-redux.AppImage
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/grumpycoders/pcsx-redux.git openbios-src
          make -C openbios-src/src/mips/openbios

          export XDG_CONFIG_HOME="$PWD/build/weekend-runtime-smoke/config"
          export XDG_DATA_HOME="$PWD/build/weekend-runtime-smoke/data"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          EMULATOR="$PWD/squashfs-root/AppRun"
          BIOS="$PWD/openbios-src/src/mips/openbios/openbios.bin"
          CUE="$PWD/upstream/funkin.cue"
          EXE="$PWD/upstream/funkin.ps-exe"
          : > build/weekend-runtime-smoke/emulator.log
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -euo pipefail
            "$1" -bios "$2" -iso "$3" -exe "$4" -run -stdout -interpreter -softgpu \
              > build/weekend-runtime-smoke/emulator.log 2>&1 &
            emulator_pid=$!
            sleep 12
            kill -0 "$emulator_pid"
            import -window root build/weekend-runtime-smoke/cutscene-12s.png
            sleep 82
            kill -0 "$emulator_pid"
            import -window root build/weekend-runtime-smoke/stage-94s.png
            sleep 12
            kill -0 "$emulator_pid"
            import -window root build/weekend-runtime-smoke/stage-106s.png
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
          ' _ "$EMULATOR" "$BIOS" "$CUE" "$EXE"

          for frame in build/weekend-runtime-smoke/*.png; do
            tesseract "$frame" stdout 2>/dev/null | tee "${frame%.png}.txt"
          done
          if grep -Eiq 'fatal|malloc|asyncreadfile|allocation failed' build/weekend-runtime-smoke/*.txt; then
            echo 'Weekend runtime smoke captured a fatal allocation screen' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          paths=sorted(Path('build/weekend-runtime-smoke').glob('*.png'))
          spreads={}
          for path in paths:
              stat=ImageStat.Stat(Image.open(path).convert('RGB'))
              spread=sum(high-low for low,high in stat.extrema)
              spreads[path.name]=spread
              print(f'RUNTIME_FRAME {path} spread={spread}')
          # A movie can legitimately be on a full-black transition frame at
          # 12 seconds.  The two post-cutscene frames must contain the stage.
          for name in ('stage-94s.png','stage-106s.png'):
              if spreads.get(name,0) < 24:
                  raise SystemExit(f'{name}: effectively blank post-cutscene runtime capture')
              print(f'RUNTIME_STAGE_OK {name} spread={spreads[name]}')
          PY
          if grep -Eiq 'fatal|malloc|asyncreadfile|allocation failed' build/weekend-runtime-smoke/emulator.log; then
            exit 1
          fi

          cp /tmp/weekend-production/funkin.ps-exe upstream/funkin.ps-exe
          cp /tmp/weekend-production/funkin.bin upstream/funkin.bin
          cp /tmp/weekend-production/funkin.cue upstream/funkin.cue
          cp /tmp/weekend-production/main.c upstream/src/main.c

      - name: Upload Weekend 1 runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekend1-runtime-diagnostics-${{ github.sha }}
          compression-level: 0
          if-no-files-found: warn
          path: build/weekend-runtime-smoke/

      - name: Package Pico Mixes v1 checkpoint
        run: |
          mkdir -p build/release/v7-1-validation build/release/freeplay-v1-validation build/release/base-weeks-v1-validation build/release/console-options-v1-validation build/release/sserafim-v1-validation build/release/pico-mixes-v1-validation build/release/weekend-runtime-smoke
          cp upstream/funkin.bin build/release/PSXFunkin_v084_Pico_Mixes_v1.bin
          cat > build/release/PSXFunkin_v084_Pico_Mixes_v1.cue <<'EOF'
          FILE "PSXFunkin_v084_Pico_Mixes_v1.bin" BINARY
            TRACK 01 MODE2/2352
            INDEX 01 00:00:00
          EOF
          cp upstream/funkin.ps-exe build/release/
          cp build/menu_visual_sources.json build/erect_audio.json build/v084_charts.json build/freeplay_parity_v1.json build/pause_menu_v1.json build/base_weeks_v1.json build/console_options_v1.json build/weekend1_assets_v2.json build/weekend1_charts_v2.json build/weekend1_audio_v2.json build/weekend1_movies_v2.json build/sserafim_assets_v1.json build/sserafim_charts_v1.json build/sserafim_audio_v1.json build/sserafim_movies_v1.json build/pico_mix_assets_v1.json build/pico_mix_content_v1.json build/pico_mix_movies_v1.json build/release/
          cp build/charselect_v7_1_validation/*.png build/release/v7-1-validation/
          cp build/freeplay-v1-validation/*.png build/release/freeplay-v1-validation/
          cp build/base-weeks-v1-validation/*.png build/release/base-weeks-v1-validation/
          cp build/console-options-v1-validation/*.png build/release/console-options-v1-validation/
          cp upstream/build-sserafim/background/sserafim_preview.png build/release/sserafim-v1-validation/
          cp build/pico-mixes-v1-validation/*.png build/release/pico-mixes-v1-validation/
          cp build/weekend-runtime-smoke/*.png build/weekend-runtime-smoke/*.txt build/weekend-runtime-smoke/emulator.log build/release/weekend-runtime-smoke/
          cat > build/release/PICO_MIXES_V1.txt <<'EOF'
          Official Pico Mixes v1 checkpoint
          - Character Select v7.1 visual hierarchy and audio are frozen unchanged.
          - Pico is unlocked in official Character Select position 3 with authentic Pico/Nene Chill animations, Pico PixelatedIcon, nametag, and selection states.
          - Pico Freeplay has its official 42-frame DJ, Pico background/capsules/selectors, and a character-filtered catalog.
          - All 15 official Pico Mix easy/normal/hard charts, masters, vocals, camera/zoom/bop/scroll events, special animations, misses, note kinds, and stage variants are integrated.
          - Dark, Christmas, Pixel, and Stress use authentic Pico/Nene variants; Spooky Dark, bloody Tankman, and Otis are authentic source conversions.
          - Stress includes the official opening video and the official ending Animate/audio timeline as PS1 STR cutscenes.
          - Freeplay parity, the real pause menu, authentic base Weeks 2/5/6, and console Options/saves remain integrated.
          - Weekend 1 remains fully integrated with its four songs, official FMVs, in-engine intro/ending beats, event-driven cameras, street traffic, rain, lightning, can/gun notes, and Blazin' fight reactions.
          - SPAGHETTI uses the exact official v0.8.4 easy/normal/hard charts and all 468 official chart events.
          - Kazuha, Sakura, Yunjin, Chaewon, Eunchae, and the collaboration Girlfriend use authentic official source frames converted to native PS1 TIM archives.
          - Sakura's joint/BF1/BF2 note styles and miss animations, GF's Beautiful styles, group singing handoffs, health-icon swaps, camera/zoom/bop events, diner lighting, dust, darkness, covers, flashes, pulses, door kicks, and guitar vibration are active.
          - The exact licensed Inst and Sakura vocal Ogg streams are recovered byte-for-byte from the official v0.8.4 Linux executable and converted to resumable two-channel CD-XA.
          - The official cutscene timeline, audio, and artwork are pre-rendered into PS1 STR intro and ending movies.
          EOF
          (cd build/release && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          sha256sum build/release/PSXFunkin_v084_Pico_Mixes_v1.bin
          stat -c '%n %s bytes' build/release/PSXFunkin_v084_Pico_Mixes_v1.bin

      - name: Upload runtime-verified checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: psxfunkin-weekend1-runtime-verified-${{ github.sha }}
          compression-level: 0
          path: build/release/

      - name: Publish Pico Mixes v1 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA:0:12}"
          TAG="pico-mixes-v1-${SHORT}"
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'PSXFunkin official Pico Mixes v1 test' \
            --notes 'DuckStation checkpoint for all 15 official Pico Mixes, authentic Pico/Nene Character Select and Freeplay variants, per-song events and character variants, and the complete Stress Pico cutscenes. LE SSERAFIM, Weekend 1, and every earlier v7.1, Freeplay, pause, base-week, and console-save checkpoint remain integrated. This is not the final release.' \
            build/release/PSXFunkin_v084_Pico_Mixes_v1.bin \
            build/release/PSXFunkin_v084_Pico_Mixes_v1.cue \
            build/release/funkin.ps-exe \
            build/release/menu_visual_sources.json \
            build/release/erect_audio.json \
            build/release/v084_charts.json \
            build/release/freeplay_parity_v1.json \
            build/release/pause_menu_v1.json \
            build/release/base_weeks_v1.json \
            build/release/console_options_v1.json \
            build/release/weekend1_assets_v2.json \
            build/release/weekend1_charts_v2.json \
            build/release/weekend1_audio_v2.json \
            build/release/weekend1_movies_v2.json \
            build/release/sserafim_assets_v1.json \
            build/release/sserafim_charts_v1.json \
            build/release/sserafim_audio_v1.json \
            build/release/sserafim_movies_v1.json \
            build/release/pico_mix_assets_v1.json \
            build/release/pico_mix_content_v1.json \
            build/release/pico_mix_movies_v1.json \
            build/release/PICO_MIXES_V1.txt \
            build/release/SHA256SUMS.txt \
            build/release/v7-1-validation/*.png \
            build/release/freeplay-v1-validation/*.png \
            build/release/base-weeks-v1-validation/*.png \
            build/release/console-options-v1-validation/*.png \
            build/release/sserafim-v1-validation/*.png \
            build/release/pico-mixes-v1-validation/*.png \
            build/release/weekend-runtime-smoke/*

      - name: Persist CI outcome for checkpoint monitoring
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          SHORT="${GITHUB_SHA:0:12}"
          STATUS_PATH="ci-status/pico-mixes-v1-${SHORT}-attempt-${GITHUB_RUN_ATTEMPT}.json"
          export SHORT STATUS_PATH
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload={
              'workflow':'Official Pico Mixes v1',
              'status':os.environ['JOB_STATUS'],
              'sha':os.environ['GITHUB_SHA'],
              'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
          }
          Path('/tmp/sserafim-ci-status.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
          CONTENT="$(base64 -w0 /tmp/sserafim-ci-status.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" \
            -f message="Record official Pico Mixes v1 CI ${JOB_STATUS}" \
            -f content="$CONTENT" \
            -f branch="full-port-completion"
