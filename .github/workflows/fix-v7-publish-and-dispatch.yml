name: Fix v7 prerelease upload and dispatch

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths:
      - '.github/workflows/fix-v7-publish-and-dispatch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: charselect-full-checkpoint
          fetch-depth: 0

      - name: Fix v7 release upload list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/charselect-source-v7-build.yml')
          s = p.read_text()
          old = '''            build/release/* \\\n            build/release/v7-validation/*\n'''
          new = '''            build/release/PSXFunkin_v084_Character_Select_Source_v7.bin \\\n            build/release/PSXFunkin_v084_Character_Select_Source_v7.cue \\\n            build/release/funkin.ps-exe \\\n            build/release/menu_visual_sources.json \\\n            build/release/erect_audio.json \\\n            build/release/v084_charts.json \\\n            build/release/CHARSELECT_SOURCE_V7.txt \\\n            build/release/SHA256SUMS.txt \\\n            build/release/v7-validation/*.png\n'''
          if s.count(old) != 1:
              raise SystemExit(f'publish glob anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          grep -A25 'Publish source v7 prerelease' .github/workflows/charselect-source-v7-build.yml

      - name: Commit publish fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/charselect-source-v7-build.yml
          git commit -m 'Fix v7 prerelease asset upload'
          git push origin HEAD:charselect-full-checkpoint

      - name: Dispatch corrected v7 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          gh workflow run charselect-source-v7-build.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref charselect-full-checkpoint
