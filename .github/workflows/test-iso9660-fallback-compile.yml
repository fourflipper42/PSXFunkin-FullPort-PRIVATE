name: Compile-test ISO9660 lookup fallback

on:
  push:
    branches: [full-port-completion]
    paths:
      - '.github/workflows/test-iso9660-fallback-compile.yml'
      - 'scripts/apply_iso9660_lookup_fallback.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl unzip gcc-mipsel-linux-gnu g++-mipsel-linux-gnu binutils-mipsel-linux-gnu

      - name: Fetch exact upstream baseline
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://codeload.github.com/cuckydev/PSXFunkin/tar.gz/850e0207479d8fb658bdc7637f6bfbc28a2b4066 \
            -o /tmp/upstream.tar.gz
          mkdir upstream
          tar -xzf /tmp/upstream.tar.gz -C upstream --strip-components=1

      - name: Apply and validate lookup fallback
        run: |
          python3 -m py_compile scripts/apply_iso9660_lookup_fallback.py
          python3 scripts/apply_iso9660_lookup_fallback.py --upstream upstream
          grep -q 'IO_ISOSearchFile' upstream/src/io.c
          grep -q 'CdSearchFile(file, (char\*)path)' upstream/src/io.c
          grep -q 'IO_SearchFile(&file, str->FileName)' upstream/src/strplay.c
          grep -q 'W1_CUCKYDEV_MOVIE_ENTRY_V10' upstream/src/movie.c
          grep -q 'W1_CUCKYDEV_STR_CONTRACT_V10' upstream/src/strplay.c
          grep -q 'DecDCTvlc(next, strEnv->VlcBuff_ptr\[strEnv->VlcID\]);' upstream/src/strplay.c
          grep -q 'CdlModeStream | CdlModeSpeed | CdlModeRT' upstream/src/strplay.c
          ! grep -q 'DecDCTvlc2(' upstream/src/strplay.c
          ! grep -q 'CdlModeStream2' upstream/src/strplay.c

          # This diagnostic compiles the untouched t0.12 menu, which predates
          # the full-port CharacterSelect page enum. The production pipeline
          # adds that enum before applying this helper. Alias only that later
          # enum to an existing page here so this job remains an independent
          # compile test of IO_SearchFile + Movie_Play + strplay.c.
          sed -i 's/MenuPage_CharacterSelect/MenuPage_Main/g' upstream/src/menu.c

      - name: Acquire PsyQ compatibility libraries
        run: |
          mkdir -p /tmp/psyq upstream/mips/psyq
          curl -fL --retry 3 --retry-delay 2 http://psx.arthus.net/sdk/Psy-Q/psyq-4_7-converted-light.zip -o /tmp/psyq.zip
          unzip -q /tmp/psyq.zip -d /tmp/psyq
          INC="$(find /tmp/psyq -type d -name include -print -quit)"
          LIB="$(find /tmp/psyq -type d -name lib -print -quit)"
          test -n "$INC"; test -n "$LIB"
          cp -a "$INC" upstream/mips/psyq/include
          cp -a "$LIB" upstream/mips/psyq/lib

      - name: Compile patched IO movie and full baseline
        working-directory: upstream
        run: |
          make clean || true
          make -j2
          test -s funkin.ps-exe
          sha256sum funkin.ps-exe
