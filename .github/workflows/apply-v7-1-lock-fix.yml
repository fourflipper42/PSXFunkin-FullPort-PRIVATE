name: Apply v7.1 active intro validation fix

on:
  push:
    branches: [ charselect-v7-1-cleanup ]
    paths:
      - '.github/workflows/apply-v7-1-lock-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: charselect-v7-1-cleanup
          fetch-depth: 1

      - name: Replace stale intro validation with active-path validation
        run: |
          python3 scripts/patch_v7_1_active_intro_check.py
          python3 -m py_compile scripts/apply_charselect_v7_1_cleanup.py
          grep -q "native v7.1 intro bank is not the active Character Select intro" scripts/apply_charselect_v7_1_cleanup.py
          git diff --check

      - name: Commit validation fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/apply_charselect_v7_1_cleanup.py
          git commit -m 'Validate active v7.1 intro path instead of stale literal'
          git push origin HEAD:charselect-v7-1-cleanup

      - name: Dispatch v7.1 full build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run charselect-v7-1-build.yml --repo "${GITHUB_REPOSITORY}" --ref charselect-v7-1-cleanup
