name: Prepare public snapshot export

on:
  push:
    branches:
      - public-export-temp
    paths-ignore:
      - 'export/**'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-export-temp
          fetch-depth: 1

      - name: Build clean snapshot archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf export
          mkdir -p export
          export XZ_OPT='-9e'
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cJf /tmp/public_snapshot.tar.xz \
            .gitignore README.md patches scripts sitecustomize.py
          base64 -w0 /tmp/public_snapshot.tar.xz > /tmp/public_snapshot.b64
          split -b 3000 -d -a 3 /tmp/public_snapshot.b64 export/chunk-
          sha256sum /tmp/public_snapshot.tar.xz | awk '{print $1}' > export/archive.sha256
          stat -c '%s' /tmp/public_snapshot.tar.xz > export/archive.size
          find export -maxdepth 1 -type f -name 'chunk-*' | sort | wc -l > export/chunk-count

      - name: Store export chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add export
          git commit -m 'Prepare public snapshot archive'
          git push origin HEAD:public-export-temp
