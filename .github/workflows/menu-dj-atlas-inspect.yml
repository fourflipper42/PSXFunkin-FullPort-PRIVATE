name: Inspect official v0.8.4 DJ atlas entries

on:
  push:
    branches: [ menu-visual-parity-checkpoint ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official shared assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084 dj-source
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip'
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
      - name: Print atlas structure and DJ entries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('official-v084/images/freeplay/freeplay-boyfriend/spritemap1.json')
          data=json.loads(p.read_text())
          print('ROOT KEYS', list(data.keys()))
          wanted={str(x) for x in list(range(223,276))+list(range(447,456))+list(range(545,557))}
          for entry in data['ATLAS']['SPRITES']:
              s=entry['SPRITE']
              if s['name'] in wanted:
                  print(json.dumps(s,sort_keys=True))
          PY
          cp official-v084/images/freeplay/freeplay-boyfriend/Animation.json dj-source/
          cp official-v084/images/freeplay/freeplay-boyfriend/spritemap1.json dj-source/
          cp official-v084/images/freeplay/freeplay-boyfriend/spritemap1.png dj-source/
      - uses: actions/upload-artifact@v4
        with:
          name: official-v084-boyfriend-dj-source
          path: dj-source/
