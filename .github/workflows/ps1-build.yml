name: PSXFunkin Full Port CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps1-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install host and MIPS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl unzip cmake ninja-build pkg-config meson \
            python3-pil \
            gcc-mipsel-linux-gnu g++-mipsel-linux-gnu binutils-mipsel-linux-gnu \
            ffmpeg libavformat-dev libavfilter-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev libtinyxml2-dev

      - name: Run conversion regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Fetch exact clean cuckydev t0.12 source
        run: |
          git clone https://github.com/cuckydev/PSXFunkin.git upstream
          git -C upstream checkout 850e0207479d8fb658bdc7637f6bfbc28a2b4066
          test "$(git -C upstream rev-parse HEAD)" = "850e0207479d8fb658bdc7637f6bfbc28a2b4066"

      - name: Apply full-port source patches
        run: |
          python3 scripts/apply_patches.py upstream

      - name: Download and merge official v0.8.4 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets --pattern '*.zip'
          sha256sum official-assets/*.zip | tee build-official-assets.sha256
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
          unzip -qo official-assets/Sounds.and.Songs.zip -d official-v084
          unzip -qo official-assets/WEEKS.zip -d official-v084
          mkdir -p official-v084/fonts official-v084/exclude/data
          ASSET_REV=d1d027d4747aaba151c6df121ea736c31d6aed38
          curl -fL --retry 3 "https://raw.githubusercontent.com/FunkinCrew/Funkin.assets/$ASSET_REV/fonts/vcr.ttf" -o official-v084/fonts/vcr.ttf
          curl -fL --retry 3 "https://raw.githubusercontent.com/FunkinCrew/Funkin.assets/$ASSET_REV/exclude/data/credits.json" -o official-v084/exclude/data/credits.json
          test -d official-v084/data/songs
          test -d official-v084/shared/images/characters/pico
          test -s official-v084/songs/darnell/Inst.ogg
          test -s official-v084/songs/lit-up/Inst.ogg
          test -s official-v084/songs/2hot/Inst.ogg
          test -s official-v084/songs/blazin/Inst.ogg
          test -s official-v084/videos/videos/darnellCutscene.mp4
          test -d official-v084/weekend1/images

      - name: Generate current Tutorial and Weeks 1-7 charts
        run: |
          mkdir -p build
          python3 scripts/build_v084_legacy_charts.py \
            --data-root official-v084 \
            --iso-root upstream/iso \
            --manifest build/v084_charts.json
          python3 scripts/add_v084_chart_entries.py upstream/funkin.xml
          test "$(find upstream/iso/chart -name '*.cht' | wc -l)" -ge 98
          test -s upstream/iso/chart/1.1r.cht
          test -s upstream/iso/chart/1.1m.cht

      - name: Generate official Weekend 1 charts and assets
        run: |
          python3 scripts/build_weekend1_charts.py \
            --root official-v084 \
            --iso-root upstream/iso \
            --report build/weekend1_charts.json
          python3 scripts/build_weekend1_assets.py \
            --root official-v084 \
            --upstream upstream \
            --report build/weekend1_assets.json
          test "$(find upstream/iso/chart -name '8.*.cht' | wc -l)" -eq 14
          for f in upstream/iso/picoplay.arc upstream/iso/nene.arc upstream/iso/darnell.arc upstream/iso/picobl.arc upstream/iso/darnbl.arc upstream/iso/week8/back.arc upstream/iso/week8/blazin.arc; do test -s "$f"; done
          for f in upstream/src/character/picoplayer.c upstream/src/character/nene.c upstream/src/character/darnell.c upstream/src/character/picoblazin.c upstream/src/character/darnellblazin.c; do test -s "$f"; done

      - name: Generate complete-frame 4:3 menu artwork
        run: |
          python3 scripts/build_menu_art.py \
            --root official-v084 \
            --upstream upstream \
            --report build/menu_art.json
          test -s upstream/src/menu_art_generated.h
          test -s upstream/src/menu_intro_generated.h
          test -s upstream/iso/menu/story.fbk

      - name: Build psxavenc
        run: |
          git clone https://github.com/WonderfulToolchain/psxavenc.git psxavenc
          meson setup psxavenc/build psxavenc --buildtype=release
          meson compile -C psxavenc/build
          test -x psxavenc/build/psxavenc

      - name: Encode Weekend 1 XA and STR media
        run: |
          mkdir -p upstream/iso/music upstream/iso/movie
          python3 scripts/build_weekend1_audio.py \
            --root official-v084 \
            --out upstream/iso/music \
            --psxavenc psxavenc/build/psxavenc \
            --report build/weekend1_audio.json \
            --header upstream/src/weekend1_audio_generated.h
          python3 scripts/build_weekend1_movies.py \
            --root official-v084 \
            --out upstream/iso/movie \
            --psxavenc psxavenc/build/psxavenc \
            --report build/weekend1_movies.json \
            --header upstream/src/weekend1_movies_generated.h
          test -s upstream/src/weekend1_movies_generated.h
          grep -q 'W1_DARNELL_FRAMES' upstream/src/weekend1_movies_generated.h
          test -s upstream/iso/music/week8.xa
          test -s upstream/iso/movie/darnell.str
          test -s upstream/iso/movie/2hot.str
          test -s upstream/iso/movie/blazin.str
          test "$(( $(stat -c%s upstream/iso/music/week8.xa) % 2336 ))" -eq 0

      - name: Acquire converted PsyQ compatibility libraries for build only
        run: |
          rm -rf /tmp/psyq-extract upstream/mips/psyq
          mkdir -p /tmp/psyq-extract upstream/mips/psyq
          curl -fL --retry 3 --retry-delay 2 https://psx.arthus.net/sdk/Psy-Q/psyq-4_7-converted-light.zip -o /tmp/psyq.zip
          unzip -q /tmp/psyq.zip -d /tmp/psyq-extract
          INC="$(find /tmp/psyq-extract -type d -name include -print -quit)"
          LIB="$(find /tmp/psyq-extract -type d -name lib -print -quit)"
          test -n "$INC"; test -n "$LIB"
          cp -a "$INC" upstream/mips/psyq/include
          cp -a "$LIB" upstream/mips/psyq/lib
          test -f upstream/mips/psyq/include/libetc.h
          rm -rf /tmp/psyq.zip /tmp/psyq-extract

      - name: Build mkpsxiso
        run: |
          git clone --recursive https://github.com/CookiePLMonster/mkpsxiso.git mkpsxiso
          cmake -S mkpsxiso -B mkpsxiso/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build mkpsxiso/build
          cmake --install mkpsxiso/build
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile PSXFunkin executable
        working-directory: upstream
        run: |
          make clean
          make -j2
          test -s funkin.ps-exe
          sha256sum funkin.ps-exe

      - name: Build single-CD MODE2 BIN CUE
        working-directory: upstream
        run: |
          python3 ../scripts/prepare_homebrew_disc.py funkin.xml
          "$HOME/.local/bin/mkpsxiso" -y funkin.xml
          test -s funkin.bin
          test -s funkin.cue
          python3 ../scripts/validate_disc.py funkin.bin funkin.cue --report ../build/disc.json

      - name: Package Weekend 1 milestone
        run: |
          mkdir -p build/release
          cp upstream/funkin.bin build/release/PSXFunkin_v084_Weekend1.bin
          cat > build/release/PSXFunkin_v084_Weekend1.cue <<'EOF'
          FILE "PSXFunkin_v084_Weekend1.bin" BINARY
            TRACK 01 MODE2/2352
              INDEX 01 00:00:00
          EOF
          cp upstream/funkin.ps-exe build/release/funkin.ps-exe
          cp build/disc.json build/menu_art.json build/release/
          cp build/v084_charts.json build/weekend1_charts.json build/weekend1_assets.json build/weekend1_audio.json build/weekend1_movies.json build/release/
          (cd build/release && sha256sum PSXFunkin_v084_Weekend1.bin PSXFunkin_v084_Weekend1.cue funkin.ps-exe *.json > SHA256SUMS.txt)

      - name: Upload Weekend 1 BIN CUE
        uses: actions/upload-artifact@v4
        with:
          name: psxfunkin-v084-weekend1
          compression-level: 0
          path: build/release/
