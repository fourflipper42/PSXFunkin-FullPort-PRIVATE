name: FNF PS2 Full DVD Build

on:
  workflow_dispatch:
    inputs:
      modpack_bundle_url:
        description: 'Optional URL to a ZIP containing the user mod ZIP archives'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-dvd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PS2DEV: /home/runner/ps2dev
      PS2SDK: /home/runner/ps2dev/ps2sdk
      GSKIT: /home/runner/ps2dev/gsKit
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip xorriso python3-pil make file curl

      - name: Install current official PS2DEV toolchain
        run: |
          mkdir -p "$PS2DEV"
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-ubuntu-latest.tar.gz \
            -o /tmp/ps2dev-latest.tar.gz
          tar -xf /tmp/ps2dev-latest.tar.gz --strip-components 1 -C "$PS2DEV"
          echo "$PS2DEV/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/ee/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/iop/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/dvp/bin" >> "$GITHUB_PATH"
          echo "$PS2SDK/bin" >> "$GITHUB_PATH"

      - name: Fetch exact official FNF v0.8.4 desktop release
        run: |
          mkdir -p build/official
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/FunkinCrew/Funkin/releases/download/v0.8.4/funkin-linux-64bit.zip \
            -o build/funkin-linux-64bit.zip
          echo '50eb30c89de03a6ef34431bb75930219b897aebb59e456a169247d8b0a414321  build/funkin-linux-64bit.zip' | sha256sum -c -
          unzip -q build/funkin-linux-64bit.zip -d build/official

      - name: Locate official asset root
        run: |
          SONGS_ROOT="$(find build/official -type d -path '*/assets/songs' -print -quit)"
          if [ -z "$SONGS_ROOT" ]; then
            echo 'Could not locate assets/songs in official release' >&2
            exit 1
          fi
          ASSETS_ROOT="$(dirname "$SONGS_ROOT")"
          echo "ASSETS_ROOT=$ASSETS_ROOT" >> "$GITHUB_ENV"
          echo "official assets: $ASSETS_ROOT"

      - name: Prepare DVD staging and optional user modpack overlay
        env:
          MODPACK_BUNDLE_URL: ${{ inputs.modpack_bundle_url }}
        run: |
          rm -rf ps2/disc build/merged-assets build/modpack-bundle
          mkdir -p ps2/disc/AUDIO ps2/disc/CHART ps2/disc/GAME
          echo '{"mods":[],"fnfc":[],"nativeScripts":[],"extras":{}}' > ps2/disc/GAME/MODPACK.JSON
          BUILD_ASSETS_ROOT="$ASSETS_ROOT"

          if [ -n "$MODPACK_BUNDLE_URL" ]; then
            mkdir -p build/modpack-bundle
            curl -fL --retry 3 --retry-delay 3 "$MODPACK_BUNDLE_URL" -o build/modpack-bundle.zip
            unzip -q build/modpack-bundle.zip -d build/modpack-bundle
            mapfile -t MOD_ARCHIVES < <(find build/modpack-bundle -type f -iname '*.zip' -print | sort)
            if [ "${#MOD_ARCHIVES[@]}" -eq 0 ]; then
              echo 'Modpack bundle contained no mod ZIP archives' >&2
              exit 1
            fi
            echo "mod archives: ${#MOD_ARCHIVES[@]}"
            printf '  %s\n' "${MOD_ARCHIVES[@]}"
            python3 ps2/scripts/import_user_modpack.py \
              "$ASSETS_ROOT" \
              build/merged-assets \
              ps2/disc/GAME \
              "${MOD_ARCHIVES[@]}" \
              --manifest ps2/disc/GAME/MODPACK.JSON
            BUILD_ASSETS_ROOT="$GITHUB_WORKSPACE/build/merged-assets"
          fi

          echo "BUILD_ASSETS_ROOT=$BUILD_ASSETS_ROOT" >> "$GITHUB_ENV"
          echo "build assets: $BUILD_ASSETS_ROOT"

      - name: Convert every song variation to PS2 streaming PCM
        run: |
          python3 ps2/scripts/convert_song_audio.py \
            "$BUILD_ASSETS_ROOT" \
            ps2/disc/AUDIO \
            --manifest ps2/disc/AUDIO/AUDIOIDX.JSON

      - name: Convert every chart, variation, note-kind and event stream
        run: |
          python3 ps2/scripts/convert_charts.py \
            "$BUILD_ASSETS_ROOT" \
            ps2/disc/CHART \
            --manifest ps2/disc/CHART/CHARTIDX.JSON \
            --strict

      - name: Convert every discovered character, stage and song descriptor
        run: |
          python3 ps2/scripts/convert_game_assets.py \
            "$BUILD_ASSETS_ROOT" \
            ps2/disc/GAME \
            --strict
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('ps2/disc/GAME/GAMEIDX.JSON').read_text())
          print('characters:', len(data['discovered']['characters']))
          print('stages:', len(data['discovered']['stages']))
          print('note styles:', len(data['discovered']['noteStyles']))
          print('song descriptors:', len(data['songDescriptors']))
          print('conversion failures:', len(data['failures']))
          if data['failures']:
              raise SystemExit('strict conversion unexpectedly produced failures')
          PY

      - name: Convert Story Mode level catalog
        run: |
          python3 ps2/scripts/convert_story.py \
            "$BUILD_ASSETS_ROOT" \
            ps2/disc/GAME/STORY.FSTY \
            --manifest ps2/disc/GAME/STORY.JSON

      - name: Convert character health icons and metadata
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          data = json.loads(Path('ps2/disc/GAME/GAMEIDX.JSON').read_text())
          chars = data['discovered']['characters']
          subprocess.check_call([
              'python3', 'ps2/scripts/convert_health_icons.py',
              os.environ['BUILD_ASSETS_ROOT'], 'ps2/disc/GAME', *chars, '--strict'
          ])
          PY

      - name: Convert discovered video cutscenes
        run: |
          python3 ps2/scripts/convert_cutscenes.py \
            "$BUILD_ASSETS_ROOT" \
            ps2/disc/GAME/CUTSCENE \
            --manifest ps2/disc/GAME/CUTSCENE/CUTIDX.JSON \
            --strict

      - name: Convert every used softcoded note style
        run: |
          python3 ps2/scripts/convert_note_styles.py \
            "$BUILD_ASSETS_ROOT" \
            ps2/disc/GAME/NOTESTYLE \
            --manifest ps2/disc/GAME/NOTESTYLE/NOTESTYLE.JSON \
            --strict

      - name: Build native PS2 ELF
        working-directory: ps2
        run: |
          command -v mips64r5900el-ps2-elf-gcc
          make clean all 2>&1 | tee build-full.log
          test -s build/funkin_ps2.elf
          file build/funkin_ps2.elf
          cp build/funkin_ps2.elf disc/FUNKIN.ELF

      - name: Prepare PS2 DVD filesystem
        run: |
          cat > ps2/disc/SYSTEM.CNF <<'EOF'
          BOOT2 = cdrom0:\FUNKIN.ELF;1
          VER = 1.00
          VMODE = NTSC
          EOF
          python3 ps2/scripts/uppercase_iso_tree.py ps2/disc
          echo 'Disc staging size:'
          du -sh ps2/disc
          find ps2/disc/AUDIO -type f | wc -l | xargs echo 'audio files:'
          find ps2/disc/CHART -name '*.CHT' -type f | wc -l | xargs echo 'charts:'
          find ps2/disc/CHART -name '*.FKND' -type f | wc -l | xargs echo 'note-kind streams:'
          find ps2/disc/CHART -name 'EVENTS.FEVT' -type f | wc -l | xargs echo 'event streams:'
          find ps2/disc/GAME/CHAR -name 'CHAR.FCHR' -type f 2>/dev/null | wc -l | xargs echo 'characters:'
          find ps2/disc/GAME/STAGE -name 'STAGE.FSTG' -type f 2>/dev/null | wc -l | xargs echo 'stages:'
          find ps2/disc/GAME/ICON \( -name '*.FPTX' -o -name '*.FATL' \) -type f 2>/dev/null | wc -l | xargs echo 'health icon assets:'
          find ps2/disc/GAME/CUTSCENE -name 'CUT.FCUT' -type f 2>/dev/null | wc -l | xargs echo 'cutscenes:'
          find ps2/disc/GAME/NOTESTYLE -name 'STYLE.FNST' -type f 2>/dev/null | wc -l | xargs echo 'note styles:'
          find ps2/disc/GAME/SONG -name '*.FSON' -type f 2>/dev/null | wc -l | xargs echo 'song descriptors:'
          test -s ps2/disc/GAME/GAME.FCAT
          test -s ps2/disc/GAME/STORY.FSTY
          test -s ps2/disc/GAME/CUTSCENE/CUTIDX.JSON

      - name: Master homebrew PS2 DVD ISO
        run: |
          xorriso -as mkisofs \
            -iso-level 2 \
            -full-iso9660-filenames \
            -volid FNFPS2 \
            -o ps2/FunkinPS2.iso \
            ps2/disc
          test -s ps2/FunkinPS2.iso
          sha256sum ps2/FunkinPS2.iso | tee ps2/FunkinPS2.iso.sha256
          stat -c 'ISO bytes: %s' ps2/FunkinPS2.iso
          SIZE="$(stat -c %s ps2/FunkinPS2.iso)"
          if [ "$SIZE" -gt 4700000000 ]; then
            echo "ISO exceeds single-layer DVD capacity: $SIZE" >&2
            exit 1
          fi

      - name: Split large ISO for GitHub release limits
        run: |
          rm -f ps2/FunkinPS2.iso.part*
          split -b 1900M -d -a 2 ps2/FunkinPS2.iso ps2/FunkinPS2.iso.part
          ls -lh ps2/FunkinPS2.iso.part*

      - name: Publish private PS2 test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ps2-native-${GITHUB_SHA::12}"
          TITLE="FNF PS2 native test ${GITHUB_SHA::12}"
          NOTES=$'Native PS2 development checkpoint.\n\nIncludes the native ELF, full DVD ISO split into release-safe parts, Story/Freeplay catalogs, health icons, cutscenes, note kinds/events, and optional user modpack assets. Reassemble ISO parts in lexical order before testing.'
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease \
            ps2/build/funkin_ps2.elf \
            ps2/build-full.log \
            ps2/FunkinPS2.iso.sha256 \
            ps2/FunkinPS2.iso.part* \
            ps2/disc/AUDIO/AUDIOIDX.JSON \
            ps2/disc/CHART/CHARTIDX.JSON \
            ps2/disc/GAME/GAMEIDX.JSON \
            ps2/disc/GAME/STORY.JSON \
            ps2/disc/GAME/MODPACK.JSON \
            ps2/disc/GAME/ICON/ICONIDX.JSON \
            ps2/disc/GAME/CUTSCENE/CUTIDX.JSON \
            ps2/disc/GAME/NOTESTYLE/NOTESTYLE.JSON
