name: Capture private M1 runtime

on:
  push:
    branches: [ full-port-completion ]
    paths:
      - '.github/workflows/capture-m1-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install virtual display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb imagemagick xdotool libgl1-mesa-dri \
            g++-mipsel-linux-gnu cpp-mipsel-linux-gnu binutils-mipsel-linux-gnu \
            bchunk p7zip-full

      - name: Download exact private checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p disc
          gh release download pico-mixes-v1-4d353e0238a2 \
            --repo "${GITHUB_REPOSITORY}" \
            --dir disc \
            --pattern 'PSXFunkin_v084_Pico_Mixes_v1.bin' \
            --pattern 'PSXFunkin_v084_Pico_Mixes_v1.cue'
          echo 'f6cdd8fe8fa163fbba605391261088abe60ce9da5e03a29cfd0510ef60b7cd97  disc/PSXFunkin_v084_Pico_Mixes_v1.bin' | sha256sum -c -
          echo 'fe55cd5851eca69531d3a9570194cff28ea205a6f973ebf1c273081fe4a08e3d  disc/PSXFunkin_v084_Pico_Mixes_v1.cue' | sha256sum -c -
          mkdir -p extracted/fs
          bchunk \
            disc/PSXFunkin_v084_Pico_Mixes_v1.bin \
            disc/PSXFunkin_v084_Pico_Mixes_v1.cue \
            extracted/track
          7z x -y extracted/track01.iso -oextracted/fs
          find extracted/fs -maxdepth 3 -type f | sort | sed -n '1,160p'
          find extracted/fs -maxdepth 1 -type f \
            \( -iname '*.exe' -o -iname 'SCUS_*' -o -iname 'SLUS_*' \) \
            -print -quit > extracted/exe-path.txt
          test -s extracted/exe-path.txt

      - name: Download PCSX-Redux with OpenBIOS
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced/releases/download/r7370.3e10093a-1%402026-08-01_1785584896/PCSX-Redux-r7370.3e10093a-1-anylinux-x86_64.AppImage' \
            -o pcsx-redux.AppImage
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          find squashfs-root -maxdepth 4 -type f | sort | sed -n '1,240p'

      - name: Build official OpenBIOS
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/grumpycoders/pcsx-redux.git openbios-src
          make -C openbios-src/src/mips/openbios
          test -s openbios-src/src/mips/openbios/openbios.bin
          sha256sum openbios-src/src/mips/openbios/openbios.bin

      - name: Boot disc and capture display
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p capture/home capture/config capture/data
          export HOME="$PWD/capture/home"
          export XDG_CONFIG_HOME="$PWD/capture/config"
          export XDG_DATA_HOME="$PWD/capture/data"
          EMULATOR="$PWD/squashfs-root/AppRun"
          BIOS="$PWD/openbios-src/src/mips/openbios/openbios.bin"
          GAME_EXE="$PWD/$(cat extracted/exe-path.txt)"
          test -x "$EMULATOR"
          test -s "$BIOS"
          test -s "$GAME_EXE"
          : > capture/emulator.log
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -uo pipefail
            bios_args=()
            if [[ -n "$2" ]]; then
              bios_args=(-bios "$2")
            fi
            "$1" "${bios_args[@]}" -iso "$3" -exe "$4" -run -stdout -interpreter -softgpu > capture/emulator.log 2>&1 &
            emulator_pid=$!
            for attempt in $(seq 1 30); do
              if xdotool search --onlyvisible --name "PCSX-Redux" >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            sleep 8
            import -window root capture/m1-runtime-08s.png
            sleep 8
            import -window root capture/m1-runtime-16s.png
            sleep 8
            import -window root capture/m1-runtime-24s.png
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
          ' _ "$EMULATOR" "$BIOS" "$PWD/disc/PSXFunkin_v084_Pico_Mixes_v1.cue" "$GAME_EXE"
          test -s capture/m1-runtime-16s.png
          file capture/m1-runtime-*.png
          tail -n 200 capture/emulator.log || true

      - name: Save screenshot to private branch
        run: |
          CAPTURE_DIR="runtime-captures/${GITHUB_SHA}"
          mkdir -p "$CAPTURE_DIR"
          cp capture/m1-runtime-*.png capture/emulator.log "$CAPTURE_DIR/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CAPTURE_DIR"
          git commit -m "Record private M1 runtime capture ${GITHUB_SHA::12}"
          git push
