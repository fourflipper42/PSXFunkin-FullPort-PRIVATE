name: PSXFunkin v0.8.4 Menu Visual Parity

on:
  push:
    branches: [ menu-visual-parity-checkpoint ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps1-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install host and MIPS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl unzip cmake ninja-build pkg-config meson python3-pil \
            gcc-mipsel-linux-gnu g++-mipsel-linux-gnu binutils-mipsel-linux-gnu \
            ffmpeg libavformat-dev libavfilter-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev libtinyxml2-dev

      - name: Fetch exact clean cuckydev t0.12 source
        run: |
          git clone https://github.com/cuckydev/PSXFunkin.git upstream
          git -C upstream checkout 850e0207479d8fb658bdc7637f6bfbc28a2b4066
          test "$(git -C upstream rev-parse HEAD)" = "850e0207479d8fb658bdc7637f6bfbc28a2b4066"

      - name: Apply confirmed Erect and Nightmare chart support
        run: |
          git -C upstream apply ../patches/0001-current-difficulties.patch
          git -C upstream diff --check

      - name: Download official v0.8.4 source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084 build
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets \
            --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip' \
            --pattern 'Sounds.and.Songs.zip'
          echo 'd02d2ea24f9d5b032012a69ab533f724ee5cd364093e693f21d17bd3abfccc37  official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip' | sha256sum -c -
          echo '042d0ecd29a5356b4c17e750118a52485ee69466e8f1da02fed057c4abd98dc7  official-assets/Sounds.and.Songs.zip' | sha256sum -c -
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
          unzip -qo official-assets/Sounds.and.Songs.zip -d official-v084
          test -s official-v084/images/freeplay/freeplayBGweek1-bf.png
          test -s official-v084/images/freeplay/freeplayCapsule/capsule/freeplayCapsule.png
          test -s official-v084/images/charSelect/charSelectBG.png
          test -s official-v084/images/charSelect/bfChill.png
          test -s official-v084/images/charSelect/picoChill.png

      - name: Regenerate confirmed official v0.8.4 charts
        run: |
          python3 scripts/build_v084_legacy_charts.py \
            --data-root official-v084 \
            --iso-root upstream/iso \
            --manifest build/v084_charts.json
          python3 scripts/add_v084_chart_entries.py upstream/funkin.xml
          test "$(find upstream/iso/chart -name '*.cht' | wc -l)" -ge 98
          test -s upstream/iso/chart/1.1r.cht
          test -s upstream/iso/chart/1.1m.cht

      - name: Build psxavenc
        run: |
          git clone https://github.com/WonderfulToolchain/psxavenc.git psxavenc
          meson setup psxavenc/build psxavenc --buildtype=release
          meson compile -C psxavenc/build
          test -x psxavenc/build/psxavenc

      - name: Regenerate confirmed Erect XA groups
        run: |
          python3 scripts/build_erect_audio.py \
            --root official-v084 \
            --out upstream/iso/music \
            --psxavenc psxavenc/build/psxavenc \
            --header upstream/src/erect_audio_generated.h \
            --report build/erect_audio.json
          for f in erecta.xa erectb.xa erectc.xa erectd.xa; do
            test -s "upstream/iso/music/${f}"
            test "$(( $(stat -c%s "upstream/iso/music/${f}") % 2336 ))" -eq 0
          done

      - name: Apply confirmed Erect and Nightmare audio routing
        run: |
          python3 scripts/apply_erect_audio_routing.py upstream
          git -C upstream diff --check
          grep -q 'Stage_SelectMusic' upstream/src/stage.c
          grep -q 'stage.music_channel' upstream/src/stage.c

      - name: Reapply confirmed functional menu foundation
        run: |
          python3 scripts/apply_v084_menu_foundation.py upstream
          python3 scripts/finalize_v084_menu_foundation.py upstream
          git -C upstream diff --check
          grep -q 'MenuPage_CharacterSelect' upstream/src/menu.h
          grep -q 'menu_freeplay_diff' upstream/src/menu.c
          grep -q 'PICO MIXES - NEXT CHECKPOINT' upstream/src/menu.c

      - name: Convert only official v0.8.4 menu art to PS1 TIM textures
        run: |
          python3 scripts/build_v084_menu_visual_assets.py \
            --assets-root official-v084 \
            --upstream upstream \
            --report build/menu_visual_sources.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/menu_visual_sources.json').read_text())
          assert r['policy'] == 'official-v0.8.4-existing-files-only; no generated artwork'
          assert len(r['sources']) >= 15
          expected={'fpbg.tim','fpchar.tim','fpui.tim','fpextra.tim','csbg.tim','cslayer.tim','cschar.tim','csui.tim'}
          assert set(r['outputs']) == expected
          for name in expected:
              p=Path('upstream/iso/menu')/name
              assert p.is_file() and p.stat().st_size > 1000
          print('Authentic source-only menu texture manifest validated')
          PY

      - name: Apply v0.8.4 authentic menu visual parity layer
        run: |
          python3 scripts/apply_v084_menu_visual_parity.py upstream
          git -C upstream diff --check
          grep -q 'Menu_LoadV084Textures' upstream/src/menu.c
          grep -q 'Menu_SyncV084Textures' upstream/src/menu.c
          grep -q 'Menu_V084DifficultyTick' upstream/src/menu.c
          grep -q '\\\\MENU\\\\FPBG.TIM;1' upstream/src/menu.c
          grep -q '\\\\MENU\\\\CSBG.TIM;1' upstream/src/menu.c
          grep -q 'fpbg.tim' upstream/funkin.xml
          grep -q 'csui.tim' upstream/funkin.xml
          # Functional scope remains frozen: Pico visible/locked, no later songs.
          grep -q 'menu_freeplay_player == MenuPlayer_Boyfriend' upstream/src/menu.c
          ! grep -q 'StageId_8_' upstream/src/menu.c
          ! grep -q 'WEEKEND' upstream/src/menu.c
          ! grep -q 'SPAGHETTI' upstream/src/menu.c

      - name: Acquire converted PsyQ compatibility libraries for build only
        run: |
          rm -rf /tmp/psyq-extract upstream/mips/psyq
          mkdir -p /tmp/psyq-extract upstream/mips/psyq
          curl -fL --retry 3 --retry-delay 2 http://psx.arthus.net/sdk/Psy-Q/psyq-4_7-converted-light.zip -o /tmp/psyq.zip
          unzip -q /tmp/psyq.zip -d /tmp/psyq-extract
          INC="$(find /tmp/psyq-extract -type d -name include -print -quit)"
          LIB="$(find /tmp/psyq-extract -type d -name lib -print -quit)"
          test -n "$INC"; test -n "$LIB"
          cp -a "$INC" upstream/mips/psyq/include
          cp -a "$LIB" upstream/mips/psyq/lib
          test -f upstream/mips/psyq/include/libetc.h
          rm -rf /tmp/psyq.zip /tmp/psyq-extract

      - name: Build mkpsxiso
        run: |
          git clone --recursive https://github.com/CookiePLMonster/mkpsxiso.git mkpsxiso
          cmake -S mkpsxiso -B mkpsxiso/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build mkpsxiso/build
          cmake --install mkpsxiso/build
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile PSXFunkin executable
        working-directory: upstream
        run: |
          make clean || true
          make -j2
          test -s funkin.ps-exe
          sha256sum funkin.ps-exe

      - name: Build MODE2 BIN CUE
        working-directory: upstream
        run: |
          sed -i '/<license file="licensea.dat"\/>/d' funkin.xml
          "$HOME/.local/bin/mkpsxiso" -y funkin.xml
          test -s funkin.bin
          test -s funkin.cue
          test "$(( $(stat -c%s funkin.bin) % 2352 ))" -eq 0
          sectors=$(( $(stat -c%s funkin.bin) / 2352 ))
          echo "Raw disc sectors: $sectors"
          test "$sectors" -le 360000

      - name: Package menu visual parity checkpoint
        run: |
          mkdir -p build/release
          cp upstream/funkin.bin build/release/PSXFunkin_v084_Menu_Visual_Parity.bin
          cat > build/release/PSXFunkin_v084_Menu_Visual_Parity.cue <<'EOF'
          FILE "PSXFunkin_v084_Menu_Visual_Parity.bin" BINARY
            TRACK 01 MODE2/2352
              INDEX 01 00:00:00
          EOF
          cp upstream/funkin.ps-exe build/release/funkin.ps-exe
          cp upstream/src/erect_audio_generated.h build/release/erect_audio_generated.h
          cp build/v084_charts.json build/erect_audio.json build/menu_visual_sources.json build/release/
          cat > build/release/MENU_VISUAL_PARITY_SCOPE.txt <<'EOF'
          PSXFunkin v0.8.4 Menu Visual Parity Checkpoint
          - Functional baseline: confirmed menu-foundation checkpoint.
          - Visual raster sources: existing official v0.8.4 Funkin files only.
          - Technical conversions: crop/resize/atlas/palette/TIM encoding only; no invented artwork.
          - Pico remains intentionally locked pending the Pico Mix checkpoint.
          - Weekend 1 and SPAGHETTI are not included in this checkpoint.
          EOF
          grep -Fx 'FILE "PSXFunkin_v084_Menu_Visual_Parity.bin" BINARY' build/release/PSXFunkin_v084_Menu_Visual_Parity.cue
          test "$(( $(stat -c%s build/release/PSXFunkin_v084_Menu_Visual_Parity.bin) % 2352 ))" -eq 0
          (cd build/release && sha256sum PSXFunkin_v084_Menu_Visual_Parity.bin PSXFunkin_v084_Menu_Visual_Parity.cue funkin.ps-exe erect_audio_generated.h v084_charts.json erect_audio.json menu_visual_sources.json MENU_VISUAL_PARITY_SCOPE.txt > SHA256SUMS.txt)

      - name: Upload DuckStation-ready visual parity checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: psxfunkin-v084-menu-visual-parity
          compression-level: 0
          path: build/release/
