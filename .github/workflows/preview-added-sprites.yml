name: Extract private sprite previews

on:
  push:
    branches: [ full-port-completion ]
    paths:
      - '.github/workflows/preview-added-sprites.yml'
      - 'scripts/extract_sprite_previews.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bchunk p7zip-full python3-pil

      - name: Download exact private disc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p disc extracted/fs
          gh release download pico-mixes-v1-4d353e0238a2 \
            --repo "${GITHUB_REPOSITORY}" \
            --dir disc \
            --pattern 'PSXFunkin_v084_Pico_Mixes_v1.bin' \
            --pattern 'PSXFunkin_v084_Pico_Mixes_v1.cue'
          echo 'f6cdd8fe8fa163fbba605391261088abe60ce9da5e03a29cfd0510ef60b7cd97  disc/PSXFunkin_v084_Pico_Mixes_v1.bin' | sha256sum -c -
          echo 'fe55cd5851eca69531d3a9570194cff28ea205a6f973ebf1c273081fe4a08e3d  disc/PSXFunkin_v084_Pico_Mixes_v1.cue' | sha256sum -c -
          bchunk \
            disc/PSXFunkin_v084_Pico_Mixes_v1.bin \
            disc/PSXFunkin_v084_Pico_Mixes_v1.cue \
            extracted/track
          7z x -y extracted/track01.iso -oextracted/fs

      - name: Decode exact PS1 sprite textures
        run: |
          python3 scripts/extract_sprite_previews.py \
            --disc-root extracted/fs \
            --output sprite-previews/${GITHUB_SHA} \
            --decoder-root scripts/ps1asset

      - name: Save previews to private branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprite-previews/${GITHUB_SHA}
          git commit -m "Record private sprite previews ${GITHUB_SHA::12}"
          git push
