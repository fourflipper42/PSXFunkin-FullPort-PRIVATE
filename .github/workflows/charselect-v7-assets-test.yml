name: Character Select v7 Asset Validation

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths:
      - '.github/workflows/charselect-v7-assets-test.yml'
      - 'scripts/build_charselect_source_v7.py'
      - 'scripts/run_charselect_source_v7.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: sudo apt-get update -qq && sudo apt-get install -y python3-pil
      - name: Fetch official v0.8.4 visual assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084 build upstream/iso/menu upstream/src
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets \
            --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip'
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
      - name: Expand Character Select source renderer
        run: |
          gzip -dc ci/charselect/build_v084_charselect_full.py.gz > scripts/build_v084_charselect_full.py
          gzip -dc ci/charselect/apply_v084_charselect_full.py.gz > scripts/apply_v084_charselect_full.py
          python3 scripts/fix_charselect_intro_extraction.py scripts/build_v084_charselect_full.py
          python3 scripts/fix_charselect_parity_v3.py scripts/build_v084_charselect_full.py scripts/apply_v084_charselect_full.py
          python3 -m py_compile \
            scripts/build_v084_charselect_full.py \
            scripts/build_charselect_quality_v4.py \
            scripts/build_charselect_quality_v5.py \
            scripts/build_charselect_exact_ui_v6.py \
            scripts/build_charselect_source_v7.py \
            scripts/run_charselect_source_v7.py
      - name: Build and validate v7 visual assets
        run: |
          echo '{}' > build/menu_visual_sources.json
          python3 scripts/run_charselect_source_v7.py \
            --builder scripts/build_v084_charselect_full.py \
            --assets-root official-v084 \
            --upstream upstream \
            --report build/menu_visual_sources.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('build/menu_visual_sources.json').read_text())['character_select_source_v7']
          assert r['animate_traversal'] == 'layers reversed, elements forward'
          assert r['bf_reference_rmse'] < 115
          assert r['background']['frames'] >= 6
          assert r['resident_live_bank_bytes'] <= 1050000
          assert 'freeplay/icons' in r['controls']['icon_path'].lower()
          assert 'pixel' in r['controls']['icon_path'].lower()
          for f in ['csbg7.rle','cschar8.rle','csfg8.rle','csgrid7a.tim','csgrid7b.tim','csgrid7c.tim','csctrl7a.tim','csctrl7b.tim']:
              p=Path('upstream/iso/menu')/f
              assert p.is_file() and p.stat().st_size > 0, f
          vals=list(Path('build/charselect_v7_validation').glob('*.png'))
          assert len(vals) >= 8, len(vals)
          print('V7_ASSET_VALIDATION_OK')
          print(json.dumps(r,indent=2))
          PY
