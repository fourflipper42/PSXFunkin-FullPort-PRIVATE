name: PSXFunkin v0.8.4 Full Character Select

on:
  push:
    branches: [ charselect-full-checkpoint ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps1-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Expand full Character Select implementation sources
        run: |
          gzip -dc ci/charselect/build_v084_charselect_full.py.gz > scripts/build_v084_charselect_full.py
          gzip -dc ci/charselect/apply_v084_charselect_full.py.gz > scripts/apply_v084_charselect_full.py
          echo '25d291433d3f29b4962139f334113d155d3dd3374084881da4dff10a142dcc1c  scripts/build_v084_charselect_full.py' | sha256sum -c -
          echo 'f36376bd0949f1f3d2b2a0ec31a9bebccd8a29df24aff82627c8f4ff5895097e  scripts/apply_v084_charselect_full.py' | sha256sum -c -
          python3 -m py_compile scripts/build_v084_charselect_full.py scripts/apply_v084_charselect_full.py

      - name: Install host and MIPS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl unzip cmake ninja-build pkg-config meson python3-pil \
            gcc-mipsel-linux-gnu g++-mipsel-linux-gnu binutils-mipsel-linux-gnu \
            ffmpeg libavformat-dev libavfilter-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev libtinyxml2-dev

      - name: Fetch exact clean cuckydev t0.12 source
        run: |
          git clone https://github.com/cuckydev/PSXFunkin.git upstream
          git -C upstream checkout 850e0207479d8fb658bdc7637f6bfbc28a2b4066
          test "$(git -C upstream rev-parse HEAD)" = "850e0207479d8fb658bdc7637f6bfbc28a2b4066"

      - name: Apply confirmed Erect and Nightmare chart support
        run: |
          git -C upstream apply ../patches/0001-current-difficulties.patch
          git -C upstream diff --check

      - name: Download official v0.8.4 source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p official-assets official-v084 build
          gh release download assets-v084 --repo "${GITHUB_REPOSITORY}" --dir official-assets \
            --pattern 'Shared.Shaders.Scripts.Music.Images.and.Data.zip' \
            --pattern 'Sounds.and.Songs.zip'
          echo 'd02d2ea24f9d5b032012a69ab533f724ee5cd364093e693f21d17bd3abfccc37  official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip' | sha256sum -c -
          echo '042d0ecd29a5356b4c17e750118a52485ee69466e8f1da02fed057c4abd98dc7  official-assets/Sounds.and.Songs.zip' | sha256sum -c -
          unzip -qo official-assets/Shared.Shaders.Scripts.Music.Images.and.Data.zip -d official-v084
          unzip -qo official-assets/Sounds.and.Songs.zip -d official-v084
          test -s official-v084/images/freeplay/freeplayBGweek1-bf.png
          test -s official-v084/images/freeplay/freeplay-boyfriend/Animation.json
          test -s official-v084/images/charSelect/bfIcon.png
          test -s official-v084/images/charSelect/picoIcon.png

      - name: Extract authentic v0.8.4 introSelect video
        run: |
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/FunkinCrew/Funkin/releases/download/v0.8.4/funkin-linux-64bit.zip \
            -o official-assets/funkin-linux-64bit.zip
          echo '50eb30c89de03a6ef34431bb75930219b897aebb59e456a169247d8b0a414321  official-assets/funkin-linux-64bit.zip' | sha256sum -c -
          mkdir -p official-v084/videos
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil, zipfile
          zpath=Path('official-assets/funkin-linux-64bit.zip')
          outdir=Path('official-v084/videos')
          with zipfile.ZipFile(zpath) as z:
              matches=[]
              for name in z.namelist():
                  if name.endswith('/'):
                      continue
                  p=PurePosixPath(name)
                  if 'introselect' in p.name.lower() and p.suffix.lower() in {'.mp4','.webm','.ogv','.mkv'}:
                      matches.append(name)
              if not matches:
                  raise SystemExit('official desktop release contains no introSelect video')
              matches.sort(key=lambda n: (len(n), n))
              name=matches[0]
              out=outdir / PurePosixPath(name).name
              with z.open(name) as src, out.open('wb') as dst:
                  shutil.copyfileobj(src, dst)
              print(f'extracted {name} -> {out} ({out.stat().st_size} bytes)')
          PY
          INTRO="$(find official-v084/videos -type f -iname 'introSelect*' -print -quit)"
          test -n "$INTRO"
          test -s "$INTRO"
          ffprobe -v error -show_entries format=duration -of default=nw=1 "$INTRO"

      - name: Regenerate confirmed official v0.8.4 charts
        run: |
          python3 scripts/build_v084_legacy_charts.py \
            --data-root official-v084 \
            --iso-root upstream/iso \
            --manifest build/v084_charts.json
          python3 scripts/add_v084_chart_entries.py upstream/funkin.xml
          test "$(find upstream/iso/chart -name '*.cht' | wc -l)" -ge 98
          test -s upstream/iso/chart/1.1r.cht
          test -s upstream/iso/chart/1.1m.cht

      - name: Build psxavenc
        run: |
          git clone https://github.com/WonderfulToolchain/psxavenc.git psxavenc
          meson setup psxavenc/build psxavenc --buildtype=release
          meson compile -C psxavenc/build
          test -x psxavenc/build/psxavenc

      - name: Regenerate confirmed Erect XA groups
        run: |
          python3 scripts/build_erect_audio.py \
            --root official-v084 \
            --out upstream/iso/music \
            --psxavenc psxavenc/build/psxavenc \
            --header upstream/src/erect_audio_generated.h \
            --report build/erect_audio.json
          for f in erecta.xa erectb.xa erectc.xa erectd.xa; do
            test -s "upstream/iso/music/${f}"
            test "$(( $(stat -c%s "upstream/iso/music/${f}") % 2336 ))" -eq 0
          done

      - name: Apply confirmed Erect and Nightmare audio routing
        run: |
          python3 scripts/apply_erect_audio_routing.py upstream
          git -C upstream diff --check
          grep -q 'Stage_SelectMusic' upstream/src/stage.c
          grep -q 'stage.music_channel' upstream/src/stage.c

      - name: Reapply confirmed functional menu foundation
        run: |
          python3 scripts/apply_v084_menu_foundation.py upstream
          python3 scripts/finalize_v084_menu_foundation.py upstream
          git -C upstream diff --check
          grep -q 'MenuPage_CharacterSelect' upstream/src/menu.h
          grep -q 'menu_freeplay_diff' upstream/src/menu.c
          grep -q 'PICO MIXES - NEXT CHECKPOINT' upstream/src/menu.c

      - name: Convert only official v0.8.4 menu art to PS1 TIM textures
        run: |
          python3 scripts/build_v084_menu_visual_assets.py \
            --assets-root official-v084 \
            --upstream upstream \
            --report build/menu_visual_sources.json
          python3 scripts/replace_freeplay_bf_with_official_dj.py \
            --assets-root official-v084 \
            --upstream upstream \
            --report build/menu_visual_sources.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/menu_visual_sources.json').read_text())
          assert 'official-v0.8.4-existing-files-only' in r['policy']
          assert 'no replacement artwork' in r['policy']
          expected={'fpbg.tim','fpchar.tim','fpui.tim','fpextra.tim','csbg.tim','cslayer.tim','cschar.tim','csui.tim'}
          assert set(r['outputs']) == expected
          for name in expected:
              p=Path('upstream/iso/menu')/name
              assert p.is_file() and p.stat().st_size > 1000
          PY

      - name: Apply existing Freeplay visual parity and 14-frame DJ
        run: |
          python3 scripts/apply_v084_menu_visual_parity.py upstream
          python3 scripts/fix_v084_menu_visual_feedback.py upstream
          git -C upstream diff --check
          grep -q 'Menu_LoadV084Textures' upstream/src/menu.c
          grep -q 'Menu_SyncV084Textures' upstream/src/menu.c
          grep -q 'MENU_DJ_FRAME_COUNT 14' upstream/src/menu.c
          grep -q 'Menu_LoadDJFrames' upstream/src/menu.c
          grep -q 'PICO - LOCKED' upstream/src/menu.c
          grep -q 'RECT black = {0, 0, SCREEN_WIDTH, SCREEN_HEIGHT}' upstream/src/menu.c

      - name: Build and apply full authentic v0.8.4 Character Select
        run: |
          INTRO="$(find official-v084/videos -type f -iname 'introSelect*' -print -quit)"
          test -n "$INTRO"
          python3 scripts/build_v084_charselect_full.py \
            --assets-root official-v084 \
            --upstream upstream \
            --report build/menu_visual_sources.json \
            --intro-video "$INTRO" \
            --psxavenc psxavenc/build/psxavenc
          python3 scripts/apply_v084_charselect_full.py upstream
          git -C upstream diff --check
          test -s upstream/iso/menu/csanim.bin
          test "$(stat -c%s upstream/iso/menu/csanim.bin)" -eq 520128
          test -s upstream/iso/menu/cssfx.bin
          test -s upstream/src/charselect_sfx_generated.h
          test -s upstream/iso/music/charsel.xa
          test "$(( $(stat -c%s upstream/iso/music/charsel.xa) % 2336 ))" -eq 0
          grep -q 'MENU_CS_FRAME_COUNT 54' upstream/src/menu.c
          grep -q 'MENU_CS_INTRO_TICKS' upstream/src/menu.c
          grep -q 'Menu_CSGridIndex' upstream/src/menu.c
          grep -q 'Menu_CSDrawGrid' upstream/src/menu.c
          grep -q 'MENU_CS_SFX_SELECT_OFFSET' upstream/src/menu.c
          grep -q 'MENU_CS_SFX_LOCKED_OFFSET' upstream/src/menu.c
          grep -q 'MENU_CS_SFX_LIGHTS_OFFSET' upstream/src/menu.c
          grep -q 'MENU_CS_SFX_CONFIRM_OFFSET' upstream/src/menu.c
          grep -q '\\MUSIC\\CHARSEL.XA;1' upstream/src/menu.c
          grep -q 'csanim.bin' upstream/funkin.xml
          grep -q 'cssfx.bin' upstream/funkin.xml
          grep -q 'charsel.xa' upstream/funkin.xml
          ! grep -q 'RECT black = {0, 0, SCREEN_WIDTH, SCREEN_HEIGHT}' upstream/src/menu.c
          ! grep -q 'PICO - LOCKED' upstream/src/menu.c
          ! grep -q 'StageId_8_' upstream/src/menu.c
          ! grep -q 'WEEKEND' upstream/src/menu.c
          ! grep -q 'SPAGHETTI' upstream/src/menu.c
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/menu_visual_sources.json').read_text())
          cs=r['character_select_full']
          assert cs['policy'].startswith('official v0.8.4')
          assert cs['stream']['frame_count'] == 54
          assert cs['stream']['ranges']['intro'] == [0,24]
          assert cs['stream']['ranges']['idle'] == [24,12]
          assert cs['stream']['ranges']['locked'] == [36,6]
          assert cs['stream']['ranges']['confirm'] == [42,8]
          assert cs['stream']['ranges']['deny'] == [50,4]
          assert cs['intro_video']['duration_seconds'] > 0
          assert cs['sfx']['samples']['SELECT']['source'].lower().endswith(('.ogg','.wav','.mp3','.flac'))
          assert cs['sfx']['samples']['LOCKED']['bytes'] > 0
          assert cs['sfx']['samples']['LIGHTS']['bytes'] > 0
          assert cs['sfx']['samples']['CONFIRM']['bytes'] > 0
          print(json.dumps(cs, indent=2))
          PY

      - name: Acquire converted PsyQ compatibility libraries for build only
        run: |
          rm -rf /tmp/psyq-extract upstream/mips/psyq
          mkdir -p /tmp/psyq-extract upstream/mips/psyq
          curl -fL --retry 3 --retry-delay 2 http://psx.arthus.net/sdk/Psy-Q/psyq-4_7-converted-light.zip -o /tmp/psyq.zip
          unzip -q /tmp/psyq.zip -d /tmp/psyq-extract
          INC="$(find /tmp/psyq-extract -type d -name include -print -quit)"
          LIB="$(find /tmp/psyq-extract -type d -name lib -print -quit)"
          test -n "$INC"; test -n "$LIB"
          cp -a "$INC" upstream/mips/psyq/include
          cp -a "$LIB" upstream/mips/psyq/lib
          test -f upstream/mips/psyq/include/libetc.h
          rm -rf /tmp/psyq.zip /tmp/psyq-extract

      - name: Build mkpsxiso
        run: |
          git clone --recursive https://github.com/CookiePLMonster/mkpsxiso.git mkpsxiso
          cmake -S mkpsxiso -B mkpsxiso/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build mkpsxiso/build
          cmake --install mkpsxiso/build
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile PSXFunkin executable
        working-directory: upstream
        run: |
          make clean || true
          make -j2
          test -s funkin.ps-exe
          sha256sum funkin.ps-exe

      - name: Build MODE2 BIN CUE
        working-directory: upstream
        run: |
          sed -i '/<license file="licensea.dat"\/>/d' funkin.xml
          "$HOME/.local/bin/mkpsxiso" -y funkin.xml
          test -s funkin.bin
          test -s funkin.cue
          test "$(( $(stat -c%s funkin.bin) % 2352 ))" -eq 0
          sectors=$(( $(stat -c%s funkin.bin) / 2352 ))
          echo "Raw disc sectors: $sectors"
          test "$sectors" -le 360000

      - name: Package full Character Select checkpoint
        run: |
          mkdir -p build/release
          cp upstream/funkin.bin build/release/PSXFunkin_v084_Full_Character_Select.bin
          cat > build/release/PSXFunkin_v084_Full_Character_Select.cue <<'EOF'
          FILE "PSXFunkin_v084_Full_Character_Select.bin" BINARY
            TRACK 01 MODE2/2352
              INDEX 01 00:00:00
          EOF
          cp upstream/funkin.ps-exe build/release/funkin.ps-exe
          cp upstream/src/erect_audio_generated.h build/release/erect_audio_generated.h
          cp upstream/src/charselect_sfx_generated.h build/release/charselect_sfx_generated.h
          cp build/v084_charts.json build/erect_audio.json build/menu_visual_sources.json build/release/
          cat > build/release/CHARACTER_SELECT_SCOPE.txt <<'EOF'
          PSXFunkin v0.8.4 Full Character Select checkpoint
          - Authentic first-entry introSelect animation sampled from the official v0.8.4 desktop release at its original duration.
          - Live scene rebuilt from shipped v0.8.4 Character Select files: background, crowd, stage, curtains, bar, lights, BF/GF/locked character Animate data, speakers, foreground and choice-card effects.
          - 3x3 wrapping selector with layered cursor trails, official lock colors, BF/locked nametags, confirm and deny states.
          - Official stayFunky Character Select music converted to PS1 XA.
          - Official CS_select, CS_locked, CS_Lights and CS_confirm effects converted to SPU ADPCM and mixed over XA on voice 23.
          - Boyfriend is the only functional selection in this checkpoint. Pico/later slots remain locked until the Pico Mix milestone.
          - Existing 14-frame official Boyfriend DJ Freeplay implementation is preserved.
          - No replacement/generated artwork. No Weekend 1 or SPAGHETTI content.
          EOF
          grep -Fx 'FILE "PSXFunkin_v084_Full_Character_Select.bin" BINARY' build/release/PSXFunkin_v084_Full_Character_Select.cue
          test "$(( $(stat -c%s build/release/PSXFunkin_v084_Full_Character_Select.bin) % 2352 ))" -eq 0
          (cd build/release && sha256sum * > SHA256SUMS.txt)

      - name: Upload DuckStation-ready full Character Select checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: psxfunkin-v084-full-character-select
          compression-level: 0
          path: build/release/
