name: FNF PS2 Native Build

on:
  push:
    branches: [ ps2-full-port ]
    paths:
      - 'ps2/**'
      - '.github/workflows/ps2-build.yml'
  pull_request:
    branches: [ full-port-completion, ps2-full-port ]
    paths:
      - 'ps2/**'
      - '.github/workflows/ps2-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-ps2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PS2 ELF with current ps2dev environment
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          docker pull ps2dev/ps2dev:latest
          docker run --rm \
            -v "$PWD:/work" \
            -w /work/ps2 \
            ps2dev/ps2dev:latest \
            /bin/sh -c 'apk add --no-cache make >/dev/null && command -v mips64r5900el-ps2-elf-gcc && make clean all' \
            2>&1 | tee ps2-build.log

      - name: Report compiler failure on validation PR
        if: steps.compile.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### PS2 compiler output'
            echo
            echo '```text'
            tail -n 100 ps2-build.log
            echo '```'
          } > compiler-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file compiler-comment.md
          exit 1

      - name: Fail non-PR compile cleanly
        if: steps.compile.outcome == 'failure' && github.event_name != 'pull_request'
        run: exit 1

      - name: Verify ELF
        if: steps.compile.outcome == 'success'
        run: |
          test -s ps2/build/funkin_ps2.elf
          file ps2/build/funkin_ps2.elf
          sha256sum ps2/build/funkin_ps2.elf | tee ps2/SHA256SUMS.txt

      - name: Upload PS2 bootstrap
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fnf-ps2-bootstrap
          compression-level: 0
          path: |
            ps2/build/funkin_ps2.elf
            ps2/SHA256SUMS.txt
