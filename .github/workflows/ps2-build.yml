name: FNF PS2 Native Build

on:
  push:
    branches: [ ps2-full-port ]
    paths:
      - 'ps2/**'
      - '.github/workflows/ps2-build.yml'
  pull_request:
    branches: [ full-port-completion, ps2-full-port ]
    paths:
      - 'ps2/**'
      - '.github/workflows/ps2-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-ps2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PS2 ELF with current ps2dev environment
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          docker pull ps2dev/ps2dev:latest
          docker run --rm \
            -v "$PWD:/work" \
            -w /work/ps2 \
            ps2dev/ps2dev:latest \
            /bin/sh -c 'apk add --no-cache make >/dev/null && command -v mips64r5900el-ps2-elf-gcc && make clean all' \
            2>&1 | tee ps2-build.log

      - name: Persist compiler failure on validation branch
        if: steps.compile.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          mkdir -p .ci
          tail -n 140 ps2-build.log > .ci/ps2-build-error.txt
          CONTENT="$(base64 -w0 .ci/ps2-build-error.txt)"
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/.ci/ps2-build-error.txt?ref=$HEAD_BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.ci/ps2-build-error.txt" \
              -f message='Update PS2 compiler diagnostic' \
              -f content="$CONTENT" \
              -f branch="$HEAD_BRANCH" \
              -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.ci/ps2-build-error.txt" \
              -f message='Record PS2 compiler diagnostic' \
              -f content="$CONTENT" \
              -f branch="$HEAD_BRANCH" >/dev/null
          fi
          exit 1

      - name: Fail non-PR compile cleanly
        if: steps.compile.outcome == 'failure' && github.event_name != 'pull_request'
        run: exit 1

      - name: Verify ELF
        if: steps.compile.outcome == 'success'
        run: |
          test -s ps2/build/funkin_ps2.elf
          file ps2/build/funkin_ps2.elf
          sha256sum ps2/build/funkin_ps2.elf | tee ps2/SHA256SUMS.txt

      - name: Upload PS2 bootstrap
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fnf-ps2-bootstrap
          compression-level: 0
          path: |
            ps2/build/funkin_ps2.elf
            ps2/SHA256SUMS.txt
