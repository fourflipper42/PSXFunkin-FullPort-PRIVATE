name: Capture failed v7 compiler log

on:
  push:
    branches: [ charselect-full-checkpoint ]
    paths:
      - '.github/workflows/v7-fetch-failed-log.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch failed v7 run log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci/diagnostics
          set +e
          gh run view 31291748697 --repo "${GITHUB_REPOSITORY}" --log-failed > ci/diagnostics/v7_compile_failure.txt 2>&1
          STATUS=$?
          set -e
          echo >> ci/diagnostics/v7_compile_failure.txt
          echo "gh_run_view_status=${STATUS}" >> ci/diagnostics/v7_compile_failure.txt
          test -s ci/diagnostics/v7_compile_failure.txt
          tail -n 200 ci/diagnostics/v7_compile_failure.txt
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/diagnostics/v7_compile_failure.txt
          git commit -m 'Record v7 compiler failure'
          git push origin HEAD:charselect-full-checkpoint
